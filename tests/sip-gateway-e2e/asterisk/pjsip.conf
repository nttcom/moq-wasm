; Stands in for Twilio Elastic SIP Trunking with Secure Trunking: SIP over
; TLS only, SDES-SRTP only, PCMU/PCMA, RFC 4733 DTMF, the gateway known by
; its address and challenged with digest on every INVITE, and calls to the
; app's number sent to the gateway's origination URI.

[transport-tls]
type = transport
protocol = tls
bind = 0.0.0.0:5061
cert_file = /etc/asterisk/keys/trunk.crt
priv_key_file = /etc/asterisk/keys/trunk.key
method = tlsv1_2
; The gateway reaches the container through published ports on localhost.
external_media_address = 127.0.0.1
external_signaling_address = 127.0.0.1

[gateway]
type = endpoint
transport = transport-tls
context = from-gateway
disallow = all
allow = ulaw,alaw
media_encryption = sdes
dtmf_mode = rfc4733
auth = gateway-auth
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
direct_media = no
; Session timers (RFC 4028) at their shortest, so a call refreshes in a test.
timers = always
timers_min_se = 90
timers_sess_expires = 90
aors = gateway-aor
; The phone that calls the app's number.
from_user = +819011112222

; The origination URI: the gateway's TLS listener on the host.
[gateway-aor]
type = aor
contact = sip:host.docker.internal:5062;transport=tls

[gateway-auth]
type = auth
auth_type = userpass
username = gateway
password = gateway-secret

[gateway-identify]
type = identify
endpoint = gateway
match = 0.0.0.0/0
