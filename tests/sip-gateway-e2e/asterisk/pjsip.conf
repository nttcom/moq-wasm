; Stands in for Twilio Elastic SIP Trunking with Secure Trunking: SIP over
; TLS only, SDES-SRTP only, PCMU/PCMA, RFC 4733 DTMF, and the gateway
; known by its address and challenged with digest on every INVITE.

[transport-tls]
type = transport
protocol = tls
bind = 0.0.0.0:5061
cert_file = /etc/asterisk/keys/trunk.crt
priv_key_file = /etc/asterisk/keys/trunk.key
method = tlsv1_2
; The gateway reaches the container through published ports on localhost.
external_media_address = 127.0.0.1
external_signaling_address = 127.0.0.1

[gateway]
type = endpoint
transport = transport-tls
context = from-gateway
disallow = all
allow = ulaw,alaw
media_encryption = sdes
dtmf_mode = rfc4733
auth = gateway-auth
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
direct_media = no

[gateway-auth]
type = auth
auth_type = userpass
username = gateway
password = gateway-secret

[gateway-identify]
type = identify
endpoint = gateway
match = 0.0.0.0/0
