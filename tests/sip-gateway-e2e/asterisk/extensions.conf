; The phone network: each number behaves as one kind of phone.
[from-gateway]
; Answers and sends back what it hears.
exten => +819000000001,1,Answer()
 same => n,Echo()
; Answers and plays a 1 kHz tone.
exten => +819000000002,1,Answer()
 same => n,Playtones(1000)
 same => n,Wait(300)
; Busy.
exten => +819000000003,1,Busy(5)
; Answers, then hangs up after two seconds.
exten => +819000000004,1,Answer()
 same => n,Playtones(1000)
 same => n,Wait(2)
 same => n,Hangup()
; Answers and hangs up once it hears the DTMF digit 5; any other digit, or
; none within 15 s, gets a 400 Hz tone instead.
exten => +819000000005,1,Answer()
 same => n,Read(DIGIT,,1,,,15)
 same => n,GotoIf($["${DIGIT}" = "5"]?heard)
 same => n,Playtones(400)
 same => n,Wait(300)
 same => n(heard),Hangup()
