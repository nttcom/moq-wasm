[package]
name = "sip-gateway-e2e"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.102"
broadcast = { path = "../../crates/broadcast" }
bytes = "1"
gstreamer = "0.25"
gstreamer-app = "0.25"
mediapack = { path = "../../crates/mediapack" }
moqt = { path = "../../crates/moqt" }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde_json = "1"
tokio = { version = "1.52.3", features = ["full"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
