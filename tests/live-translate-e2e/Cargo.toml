[package]
name = "live-translate-e2e"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
bytes = "1"
gstreamer = "0.25"
gstreamer-app = "0.25"
mediapack = { path = "../../crates/mediapack", features = ["moqt"] }
moqt = { path = "../../crates/moqt" }
msf = { path = "../../crates/msf" }
serde_json = "1.0"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
