[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "moqt"
description = "Python bindings for the moqt crate (Media over QUIC Transport)"
requires-python = ">=3.10"
dynamic = ["version"]

[tool.maturin]
features = ["pyo3/extension-module"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
