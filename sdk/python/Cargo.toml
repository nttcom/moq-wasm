[package]
name = "python"
version = "0.1.0"
edition = "2024"

[lib]
name = "moq_wasm"
crate-type = ["cdylib"]
# An extension module cannot link as a test binary; pytest covers it.
test = false
doctest = false

[dependencies]
anyhow = "1.0.102"
broadcast = { path = "../../crates/broadcast" }
bytes = "1.11.1"
telemetry-report = { path = "../../crates/telemetry-report" }
mediapack = { path = "../../crates/mediapack", features = ["moqt"] }
moqt = { path = "../../crates/moqt" }
msf = { path = "../../crates/msf" }
serde_json = "1.0.150"
pyo3 = { version = "0.30.1", features = ["abi3-py311", "anyhow"] }
pyo3-async-runtimes = { version = "0.30.0", features = ["tokio-runtime"] }
tokio = { version = "1.52.3", features = ["sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }

[build-dependencies]
pyo3-build-config = "0.30.1"
