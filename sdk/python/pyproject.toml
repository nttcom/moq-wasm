[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "moq-wasm"
version = "0.0.1"
description = "Media over QUIC Transport (MoQT) client SDK, with MSF media broadcasts and a pipecat transport"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "NTT Communications Corporation" }]

[project.urls]
Homepage = "https://github.com/nttcom/moq-wasm"
Documentation = "https://nttcom.github.io/moq-wasm/docs/python/moq_wasm.html"
Repository = "https://github.com/nttcom/moq-wasm"
Changelog = "https://github.com/nttcom/moq-wasm/blob/master/sdk/python/CHANGELOG.md"
Issues = "https://github.com/nttcom/moq-wasm/issues"

[project.optional-dependencies]
# moq_wasm.codecs comes from PyAV, outside the wheel (docs/architecture/python/sdk.md).
codecs = ["av>=15", "numpy>=1.26"]
# The transport subclasses pipecat's input and output transports and uses their protected members.
pipecat = ["moq-wasm[codecs]", "pipecat-ai>=1.13,<2"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1.4", "pytest-xdist>=3.6", "pipecat-ai>=1.13", "av>=15", "pdoc>=16", "pyright>=1.1.414"]

[tool.maturin]
python-source = "python"
module-name = "moq_wasm._native"
exclude = ["**/__pycache__/**"]

[tool.pyright]
include = ["python/moq_wasm"]
extraPaths = ["python"]
pythonVersion = "3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv]
# Rebuild the extension module when its Rust sources change. uv ignores files
# outside this directory, so a change to the moqt crate is caught by the commit.
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "src/**/*.rs" }, { file = "python/**" }, { git = { commit = true } }]
