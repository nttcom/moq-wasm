[package]
name = "wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
anyhow = "1.0.102"
bytes = "1.11.1"
console_error_panic_hook = { version = "0.1.7", optional = true }
js-sys = "0.3.100"
mediapack = { path = "../../crates/mediapack", features = ["moqt", "serde"] }
moqt = { path = "../../crates/moqt" }
msf = { path = "../../crates/msf" }
serde-wasm-bindgen = "0.6.5"
tokio = { version = "1.52.3", features = ["macros", "sync"] }
tracing = "0.1"
wasm-bindgen = "0.2.123"

[target.'cfg(target_arch = "wasm32")'.dependencies]
broadcast = { path = "../../crates/broadcast" }
telemetry-report = { path = "../../crates/telemetry-report" }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }
wasm-bindgen-futures = "0.4.73"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
