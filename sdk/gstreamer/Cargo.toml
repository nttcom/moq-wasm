[package]
name = "gst-plugin-moqt"
version = "0.1.0"
edition = "2024"
description = "GStreamer sink that publishes H.264 video and AAC audio into a MoQT relay"
repository = "https://github.com/nttcom/moq-wasm"
license = "MIT"

[lib]
name = "gstmoqt"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = { workspace = true }
bytes = { workspace = true }
gstreamer = { workspace = true }
broadcast = { path = "../../crates/broadcast" }
mediapack = { path = "../../crates/mediapack" }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, default-features = true, features = ["env-filter"] }
