[package]
name = "robotics"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
broadcast = { path = "../broadcast" }
bytes = "1"
moqt = { path = "../moqt" }
msf = { path = "../msf" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
moqt = { path = "../moqt", features = ["self-signed-cert"] }
# The round trip properties compare f64 values exactly; the default parser can
# read one ULP off.
serde_json = { version = "1", features = ["float_roundtrip"] }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
