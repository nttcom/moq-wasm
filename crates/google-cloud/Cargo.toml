[package]
name = "google-cloud"
version = "0.1.0"
edition = "2024"
description = "The Google Cloud calls the services make themselves: the workload's access token from the metadata server and conditional Cloud Storage requests"

[dependencies]
anyhow = { workspace = true }
aws-lc-rs = { workspace = true }
base64 = { workspace = true }
http-body-util = { workspace = true, optional = true }
http-server = { path = "../http-server", optional = true }
hyper = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["rustls", "json"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[features]
testing = ["dep:http-body-util", "dep:http-server", "dep:hyper", "tokio/net", "tokio/rt"]

[dev-dependencies]
http-body-util = { workspace = true }
http-server = { path = "../http-server", features = ["testing"] }
hyper = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }
