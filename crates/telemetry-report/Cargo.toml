[package]
name = "telemetry-report"
version = "0.1.0"
edition = "2024"
description = "Turns tracing events and closed spans into the telemetry ClientLog and ClientSpan records clients report to the observability server"

[dependencies]
serde_json = { workspace = true }
telemetry = { path = "../telemetry" }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["registry", "std"] }
