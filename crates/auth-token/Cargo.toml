[package]
name = "auth-token"
version = "0.1.0"
edition = "2024"
description = "The JWT a MoQT client presents in CLIENT_SETUP: its claims, HS256 signing and verification"

[dependencies]
anyhow = "1.0.102"
base64 = "0.23.1"
ring = "0.17.14"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4.6.1", features = ["derive"], optional = true }

[features]
cli = ["dep:clap"]

[[bin]]
name = "auth-token"
path = "src/bin/auth-token.rs"
required-features = ["cli"]
