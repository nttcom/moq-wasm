[package]
name = "moqt"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = { version = "1.0.102", features = ["backtrace"] }
tracing = "0.1.44"
bytes = "1"
async-trait = "0.1.89"
thiserror = "2.0.18"
futures = "0.3.32"
tokio = { version = "1.52.3", features = ["sync", "macros", "io-util"] }
tokio-util = { version = "0.7.18", features = ["codec"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
quinn = { version = "0.11.9", default-features = false, features = ["log", "platform-verifier", "runtime-tokio", "rustls-aws-lc-rs", "bloom"] }
url = "2"
rustls-native-certs = "0.8.4"
# Makes rustls clients offer the post-quantum X25519MLKEM768 key share first.
rustls = { version = "0.23.45", default-features = false, features = ["prefer-post-quantum"] }
tokio = { version = "1.52.3", features = ["full", "tracing"] }
web-transport-quinn = { version = "0.13", default-features = false, features = ["aws-lc-rs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "logging", "tls12"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
rcgen = { version = "0.14.8", default-features = false, features = ["pem", "aws_lc_rs"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.100"
wasm-bindgen = "0.2.123"
wasm-bindgen-futures = "0.4.73"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3.100"
features = [
    "BinaryType",
    "CloseEvent",
    "Event",
    "MessageEvent",
    "Performance",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "ReadableStreamReadResult",
    "Url",
    "WebTransport",
    "WebTransportBidirectionalStream",
    "WebTransportCloseInfo",
    "WebTransportDatagramDuplexStream",
    "WebTransportOptions",
    "WebTransportReceiveStream",
    "WebSocket",
    "WebTransportSendStream",
    "WritableStream",
    "WritableStreamDefaultWriter",
]

[features]
self-signed-cert = ["dep:rcgen"]

[dev-dependencies]
mockall = "0.15.0"
rcgen = { version = "0.14.8", default-features = false, features = ["pem", "aws_lc_rs"] }
tokio = { version = "1.52.3", features = ["test-util"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tokio_unstable)"] }
