[package]
name = "moqt"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = { version = "1.0.102", features = ["backtrace"] }
tracing = "0.1.44"
bytes = "1"
async-trait = "0.1.89"
serde = { version = "1.0.228", features = ["derive"] }
num_enum = "0.7.6"
thiserror = "2.0.18"
url = "2"
futures = "0.3.32"
tokio = { version = "1.52.3", features = ["sync", "macros", "io-util"] }
tokio-stream = "0.1.18"
tokio-util = { version = "0.7.18", features = ["codec"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
quinn = "0.11.9"
rustls-native-certs = "0.8.4"
tokio = { version = "1.52.3", features = ["full", "tracing"] }
web-transport-quinn = { version = "0.11", default-features = false, features = ["ring"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.100"
wasm-bindgen = "0.2.123"
wasm-bindgen-futures = "0.4.73"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3.100"
features = [
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "ReadableStreamReadResult",
    "WebTransport",
    "WebTransportBidirectionalStream",
    "WebTransportCloseInfo",
    "WebTransportDatagramDuplexStream",
    "WebTransportError",
    "WebTransportErrorOptions",
    "WebTransportReceiveStream",
    "WebTransportSendStream",
    "WritableStream",
    "WritableStreamDefaultWriter",
]

[dev-dependencies]
mockall = "0.14.0"
rcgen = "0.14.8"
