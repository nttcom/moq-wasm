[package]
name = "live-egress"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
base64 = "0.23"
bytes = "1"
clap = { version = "4.6.1", features = ["derive", "env"] }
mediapack = { path = "../mediapack", features = ["moqt"] }
moqt = { path = "../moqt" }
msf = { path = "../msf" }
serde_json = "1"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
