[package]
name = "vts"
version = "0.1.0"
edition = "2024"
description = "Verify Token Service: verifies MoQT client JWTs on behalf of the relay"

[dependencies]
anyhow = "1.0.102"
app-registry = { path = "../app-registry" }
auth-token = { path = "../auth-token" }
http-body-util = "0.1.4"
hyper = { version = "1.10.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
app-registry = { path = "../app-registry", features = ["testing"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
