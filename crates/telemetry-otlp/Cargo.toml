[package]
name = "telemetry-otlp"
version = "0.1.0"
edition = "2024"
description = "Shared tracing setup for the workspace binaries: stdout, OTLP traces, logs and metrics, and W3C trace context"

[dependencies]
anyhow = { workspace = true }
http = { workspace = true }
opentelemetry = { workspace = true, features = ["trace", "logs", "metrics"] }
opentelemetry_sdk = { workspace = true, features = ["rt-tokio", "logs", "metrics"] }
opentelemetry-otlp = { workspace = true, features = ["grpc-tonic", "http-proto", "reqwest-blocking-client", "reqwest-rustls", "trace", "logs", "metrics"] }
opentelemetry-appender-tracing = { workspace = true }
# Makes rustls clients offer the post-quantum X25519MLKEM768 key share first.
rustls = { workspace = true, features = ["prefer-post-quantum"] }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true, default-features = true, features = ["env-filter"] }

[features]
testing = []

[dev-dependencies]
opentelemetry_sdk = { workspace = true, features = ["testing"] }
