[package]
name = "console"
version = "0.1.0"
edition = "2024"
description = "Internal MoQ console: identifies an employee through IAP and serves their app from the app registry"

[dependencies]
anyhow = "1.0.102"
app-registry = { path = "../app-registry" }
auth-token = { path = "../auth-token" }
base64 = "0.23.1"
http-body-util = "0.1.4"
hyper = { version = "1.10.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"] }
ring = "0.17.14"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "sync", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
app-registry = { path = "../app-registry", features = ["testing"] }
