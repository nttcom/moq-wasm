[package]
name = "python"
version = "0.1.0"
edition = "2024"

[lib]
name = "moqt"
crate-type = ["cdylib"]
# An extension module cannot link as a test binary; pytest covers it.
test = false
doctest = false

[dependencies]
anyhow = "1.0.102"
bytes = "1.11.1"
moqt = { path = "../moqt" }
pyo3 = { version = "0.30.1", features = ["abi3-py311", "anyhow"] }
pyo3-async-runtimes = { version = "0.30.0", features = ["tokio-runtime"] }
tokio = { version = "1.52.3", features = ["sync", "time"] }
tracing = "0.1.44"

[build-dependencies]
pyo3-build-config = "0.30.1"
