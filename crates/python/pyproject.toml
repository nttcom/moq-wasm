[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "moqt"
version = "0.1.0"
description = "Python bindings for this repository's MoQT implementation"
requires-python = ">=3.11"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv]
# Rebuild the extension module when its Rust sources change. uv ignores files
# outside this directory, so a change to the moqt crate is caught by the commit.
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "src/**/*.rs" }, { git = { commit = true } }]
