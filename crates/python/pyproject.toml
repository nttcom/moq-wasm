[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "moq-wasm"
version = "0.1.0"
description = "Python SDK of this repository's MoQT implementation"
requires-python = ">=3.11"

[project.optional-dependencies]
# The codecs of the pipecat transport come from PyAV, outside the wheel (docs/architecture/python/sdk.md).
pipecat = ["pipecat-ai>=1.12", "av>=14"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pipecat-ai>=1.12", "av>=14"]

[tool.maturin]
python-source = "python"
module-name = "moq_wasm._native"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv]
# Rebuild the extension module when its Rust sources change. uv ignores files
# outside this directory, so a change to the moqt crate is caught by the commit.
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "src/**/*.rs" }, { file = "python/**" }, { git = { commit = true } }]
