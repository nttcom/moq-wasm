[package]
name = "app-registry"
version = "0.1.0"
edition = "2024"
description = "The registry of apps whose secrets sign client JWTs, kept as one JSON document in Cloud Storage or a local file"

[dependencies]
anyhow = { workspace = true }
google-cloud = { path = "../google-cloud" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "fs"] }

[features]
testing = []

[dev-dependencies]
google-cloud = { path = "../google-cloud", features = ["testing"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
