[package]
name = "app-registry"
version = "0.1.0"
edition = "2024"
description = "The registry of apps whose secrets sign client JWTs, kept as one JSON document in Cloud Storage or a local file"

[dependencies]
anyhow = "1.0.102"
google-cloud = { path = "../google-cloud" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52.3", features = ["sync", "fs"] }

[features]
testing = []

[dev-dependencies]
google-cloud = { path = "../google-cloud", features = ["testing"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
