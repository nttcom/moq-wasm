[package]
name = "recorder"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
base64 = "0.23.1"
bytes = "1"
clap = { version = "4.6.1", features = ["derive", "env"] }
http-body-util = "0.1.4"
hyper = { version = "1.10.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
mediapack = { path = "../mediapack", features = ["moqt"] }
moqt = { path = "../moqt" }
msf = { path = "../msf" }
object_store = { version = "0.14.2", default-features = false, features = ["gcp"] }
serde_json = "1"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1"
transcode = { path = "../transcode" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5.8"
