# cargo-about configuration of the license list a package ships
# (`OBS_PLUGIN_NOTICES` in the Makefile). Every accepted license is compatible
# with GPL-3.0-or-later; a library under any other license fails the build
# until its license is reviewed and listed here.
accepted = [
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
# The platforms a release is built for.
targets = [
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
# The plugin itself (`publish = false`) is not one of its libraries.
private = { ignore = true }
ignore-build-dependencies = true
ignore-dev-dependencies = true
