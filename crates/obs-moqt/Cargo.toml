[package]
name = "obs-moqt"
version = "0.1.0"
edition = "2024"
description = "OBS Studio output that publishes H.264 video and AAC audio into a MoQT relay"
repository = "https://github.com/nttcom/moq-wasm"
license = "GPL-2.0-or-later"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = { workspace = true }
bytes = { workspace = true }
broadcast = { path = "../broadcast" }
mediapack = { path = "../mediapack" }
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, default-features = true, features = ["env-filter"] }

[dev-dependencies]
proptest = { workspace = true, features = ["std"] }
