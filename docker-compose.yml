services:
  redis:
    image: redis:8.8.0@sha256:2838d5524559494f6f1cd66e97e76b200d64a633a8614200620755ed395daf32
    ports:
      - "6379:6379"
    # Relays connect to redis once at startup with no retry, so gate them on health.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  redisinsight:
    image: redis/redisinsight:3.6.0@sha256:aa21bbd198455b4ad964f76782db951155aa0d712321f599972d1525f031f0e6
    ports:
      - "5540:5540"
    depends_on:
      redis:
        condition: service_healthy

  relay-common:
    image: moqt-relay:local
    build:
      context: .
      dockerfile: relay/Dockerfile
    profiles:
      - build
    command: ["true"]

  # Authentication services. Start with `docker compose --profile auth up -d`
  # and point the relays at the VTS with AUTH_VTS_URL / AUTH_RELAY_TOKEN.
  vts:
    image: moqt-vts:local
    build:
      context: .
      dockerfile: services/vts/Dockerfile
    profiles:
      - auth
    environment:
      VTS_PORT: "8081"
      VTS_APPS_FILE: /etc/vts/apps.json
    volumes:
      - ${VTS_APPS_FILE:-./services/vts/apps.example.json}:/etc/vts/apps.json:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 2s
      timeout: 3s
      retries: 10

  relay-a:
    image: moqt-relay:local
    env_file:
      - path: .env
        required: false
    environment:
      RELAY_ID: relay-a
      RELAY_ADVERTISE_HOST: relay-a
      RELAY_PORT: "443"
      RELAY_INNER_PORT: "444"
      REDIS_URL: redis://redis:6379
      AUTH_DISABLED: ${AUTH_DISABLED:-true}
      AUTH_VTS_URL: ${AUTH_VTS_URL:-}
      AUTH_RELAY_TOKEN: ${AUTH_RELAY_TOKEN:-}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      RELAY_STDOUT_FILTER: ${RELAY_STDOUT_FILTER:-relay=info,moqt=info}
      RELAY_OTEL_FILTER: ${RELAY_OTEL_FILTER:-relay=info,moqt=info}
      RELAY_LOG_FILTER: ${RELAY_LOG_FILTER:-relay=info,moqt=info}
      RELAY_CACHE_TTL_SECS: ${RELAY_CACHE_TTL_SECS:-}
      RELAY_CACHE_EVICT_INTERVAL_SECS: ${RELAY_CACHE_EVICT_INTERVAL_SECS:-}
    ports:
      - "4433:443/udp"
    # Playwright pins the host certificate SPKI; relay must serve the same keypair.
    volumes:
      - ./relay/keys:/workspace/relay/keys:ro
    depends_on:
      redis:
        condition: service_healthy

  relay-b:
    image: moqt-relay:local
    env_file:
      - path: .env
        required: false
    environment:
      RELAY_ID: relay-b
      RELAY_ADVERTISE_HOST: relay-b
      RELAY_PORT: "443"
      RELAY_INNER_PORT: "444"
      REDIS_URL: redis://redis:6379
      AUTH_DISABLED: ${AUTH_DISABLED:-true}
      AUTH_VTS_URL: ${AUTH_VTS_URL:-}
      AUTH_RELAY_TOKEN: ${AUTH_RELAY_TOKEN:-}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      RELAY_STDOUT_FILTER: ${RELAY_STDOUT_FILTER:-relay=info,moqt=info}
      RELAY_OTEL_FILTER: ${RELAY_OTEL_FILTER:-relay=info,moqt=info}
      RELAY_LOG_FILTER: ${RELAY_LOG_FILTER:-relay=info,moqt=info}
      RELAY_CACHE_TTL_SECS: ${RELAY_CACHE_TTL_SECS:-}
      RELAY_CACHE_EVICT_INTERVAL_SECS: ${RELAY_CACHE_EVICT_INTERVAL_SECS:-}
    ports:
      - "4434:443/udp"
    # Playwright pins the host certificate SPKI; relay must serve the same keypair.
    volumes:
      - ./relay/keys:/workspace/relay/keys:ro
    depends_on:
      redis:
        condition: service_healthy
