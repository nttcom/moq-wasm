services:
  redis:
    image: redis:8.8.0@sha256:2838d5524559494f6f1cd66e97e76b200d64a633a8614200620755ed395daf32
    ports:
      - "6379:6379"
    # Relays connect to redis once at startup with no retry, so gate them on health.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  relay-common:
    image: moqt-relay:local
    build:
      context: .
      dockerfile: crates/relay/Dockerfile
    profiles:
      - build
    command: ["true"]

  vts:
    image: moqt-vts:local
    build:
      context: .
      dockerfile: crates/vts/Dockerfile
    environment:
      VTS_PORT: "8081"
      VTS_APPS_FILE: /etc/vts/apps.json
    volumes:
      - ${VTS_APPS_FILE:-./crates/vts/apps.example.json}:/etc/vts/apps.json:ro

  relay-a:
    image: moqt-relay:local
    env_file:
      - path: .env
        required: false
    environment:
      RELAY_ID: relay-a
      RELAY_ADVERTISE_HOST: relay-a
      RELAY_PUBLIC_HOST: localhost:4433
      RELAY_PORT: "443"
      RELAY_INNER_PORT: "444"
      REDIS_URL: redis://redis:6379
      AUTH_VTS_URL: ${AUTH_VTS_URL:-http://vts:8081/verify}
      # Development relay token for this relay, minted from apps.example.json (see crates/vts/README.md).
      AUTH_RELAY_TOKEN: ${AUTH_RELAY_TOKEN:-eyJhbGciOiJIUzI1NiJ9.eyJhcHBJZCI6IjExMTExMTExLTIyMjItMzMzMy00NDQ0LTU1NTU1NTU1NTU1NSIsInB1Ymxpc2giOiIiLCJzdWJzY3JpYmUiOiIiLCJpYXQiOjE3OTMwODE5ODUsImV4cCI6MjEwODQ0MTk4NSwicmVsYXlJZCI6InJlbGF5LWEifQ.DyVb-XVwjuYKppQCGu2yI-n5-ENrlSou8Akmb4pBqU0}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://clickstack-otel-collector:4317}
      RELAY_STDOUT_FILTER: ${RELAY_STDOUT_FILTER:-relay=info,moqt=info}
      RELAY_OTEL_FILTER: ${RELAY_OTEL_FILTER:-relay=info,moqt=info}
      RELAY_LOG_FILTER: ${RELAY_LOG_FILTER:-relay=info,moqt=info}
      RELAY_CACHE_TTL_SECS: ${RELAY_CACHE_TTL_SECS:-}
      RELAY_CACHE_EVICT_INTERVAL_SECS: ${RELAY_CACHE_EVICT_INTERVAL_SECS:-}
    ports:
      - "4433:443/udp"
    # Lets AUTH_VTS_URL name a VTS running on the host, as the E2E runners do.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Playwright pins the host certificate SPKI; relay must serve the same keypair.
    volumes:
      - ./crates/relay/keys:/workspace/crates/relay/keys:ro
    depends_on:
      redis:
        condition: service_healthy
      vts:
        condition: service_started

  relay-b:
    image: moqt-relay:local
    env_file:
      - path: .env
        required: false
    environment:
      RELAY_ID: relay-b
      RELAY_ADVERTISE_HOST: relay-b
      RELAY_PUBLIC_HOST: localhost:4434
      RELAY_PORT: "443"
      RELAY_INNER_PORT: "444"
      REDIS_URL: redis://redis:6379
      AUTH_VTS_URL: ${AUTH_VTS_URL:-http://vts:8081/verify}
      # Development relay token for this relay, minted from apps.example.json (see crates/vts/README.md).
      AUTH_RELAY_TOKEN: ${AUTH_RELAY_TOKEN:-eyJhbGciOiJIUzI1NiJ9.eyJhcHBJZCI6IjExMTExMTExLTIyMjItMzMzMy00NDQ0LTU1NTU1NTU1NTU1NSIsInB1Ymxpc2giOiIiLCJzdWJzY3JpYmUiOiIiLCJpYXQiOjE3OTMwODE5ODUsImV4cCI6MjEwODQ0MTk4NSwicmVsYXlJZCI6InJlbGF5LWIifQ.Di7-8H0eJQZqDWhfrKzNMTPJHTHaTvbK38lP0QfstG4}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://clickstack-otel-collector:4317}
      RELAY_STDOUT_FILTER: ${RELAY_STDOUT_FILTER:-relay=info,moqt=info}
      RELAY_OTEL_FILTER: ${RELAY_OTEL_FILTER:-relay=info,moqt=info}
      RELAY_LOG_FILTER: ${RELAY_LOG_FILTER:-relay=info,moqt=info}
      RELAY_CACHE_TTL_SECS: ${RELAY_CACHE_TTL_SECS:-}
      RELAY_CACHE_EVICT_INTERVAL_SECS: ${RELAY_CACHE_EVICT_INTERVAL_SECS:-}
    ports:
      - "4434:443/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Playwright pins the host certificate SPKI; relay must serve the same keypair.
    volumes:
      - ./crates/relay/keys:/workspace/crates/relay/keys:ro
    depends_on:
      redis:
        condition: service_healthy
      vts:
        condition: service_started

  clickhouse:
    image: clickhouse/clickhouse-server:26.10.3.7@sha256:739e099abd1157390960a59e4532d21781d8fde57e6e4151cb920ea02c30b1ce
    environment:
      CLICKHOUSE_USER: observability
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-observability}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "observability", "--password", "${CLICKHOUSE_PASSWORD:-observability}", "--query", "SELECT 1"]
      interval: 2s
      timeout: 3s
      retries: 20

  observability:
    image: moqt-observability:local
    build:
      context: .
      dockerfile: crates/observability/Dockerfile
    environment:
      OBSERVABILITY_RELAYS: relay-a=moqt://relay-a:444,relay-b=moqt://relay-b:444
      # The relay token opens the inner endpoint without expiring; see docs/architecture/observability/architecture.md.
      OBSERVABILITY_AUTH_TOKEN: ${AUTH_RELAY_TOKEN:-eyJhbGciOiJIUzI1NiJ9.eyJhcHBJZCI6IjExMTExMTExLTIyMjItMzMzMy00NDQ0LTU1NTU1NTU1NTU1NSIsInB1Ymxpc2giOiIiLCJzdWJzY3JpYmUiOiIiLCJpYXQiOjE3ODkwOTMzMzMsImV4cCI6MjEwNDQ1MzMzM30.F_vveCJktf2C5cAnojDN_wLUZm6ILQpCACOvXxezqD4}
      OBSERVABILITY_INSECURE: "1"
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: observability
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-observability}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://clickstack-otel-collector:4318/v1/metrics
    ports:
      - "8095:8095"
    depends_on:
      clickhouse:
        condition: service_healthy
      clickstack-otel-collector:
        condition: service_started
      relay-a:
        condition: service_started
      relay-b:
        condition: service_started
      hyperdx:
        condition: service_started

  # ClickStack: its collector writes the relays' OTLP logs and traces and
  # observability's relay metrics into the `otel` database of the clickhouse
  # service. HyperDX (http://localhost:8080) searches them. Both start with
  # observability.
  # Relays export only with OTEL_SDK_DISABLED=false.
  clickstack-otel-collector:
    image: docker.clickhouse.com/clickhouse/clickstack-otel-collector:2.42.0@sha256:90ca453137798285871190722fcd7c79e7731e9376cf23a922d6f855bf94f3c7
    environment:
      CLICKHOUSE_ENDPOINT: tcp://clickhouse:9000?dial_timeout=10s
      CLICKHOUSE_USER: observability
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-observability}
      HYPERDX_OTEL_EXPORTER_CLICKHOUSE_DATABASE: otel
      HYPERDX_OTEL_EXPORTER_TABLES_TTL: 168h
      HYPERDX_LOG_LEVEL: info
    depends_on:
      clickhouse:
        condition: service_healthy

  clickstack-mongo:
    image: mongo:5.0.32-focal@sha256:3b6c281e1c0825d34b28e503b0bc97174132a283eeb79d402bd3893944cf9fd7
    volumes:
      - clickstack-mongo-data:/data/db

  hyperdx:
    image: docker.hyperdx.io/hyperdx/hyperdx:2.42.0@sha256:409af6d989595376507283c7703b04912a2f66042af434e830ca4b410fc5a716
    environment:
      FRONTEND_URL: http://localhost:8080
      HYPERDX_API_PORT: "8000"
      HYPERDX_APP_PORT: "8080"
      HYPERDX_APP_URL: http://localhost
      HYPERDX_LOG_LEVEL: info
      MONGO_URI: mongodb://clickstack-mongo:27017/hyperdx
      SERVER_URL: http://127.0.0.1:8000
      USAGE_STATS_ENABLED: "false"
      DEFAULT_CONNECTIONS: '[{"name":"ClickHouse","host":"http://clickhouse:8123","username":"observability","password":"${CLICKHOUSE_PASSWORD:-observability}"}]'
      DEFAULT_SOURCES: '[{"from":{"databaseName":"otel","tableName":"otel_logs"},"kind":"log","timestampValueExpression":"Timestamp","name":"Logs","displayedTimestampValueExpression":"Timestamp","implicitColumnExpression":"Body","serviceNameExpression":"ServiceName","bodyExpression":"Body","eventAttributesExpression":"LogAttributes","resourceAttributesExpression":"ResourceAttributes","defaultTableSelectExpression":"Timestamp,ServiceName,SeverityText,Body","severityTextExpression":"SeverityText","severityNumberExpression":"SeverityNumber","eventNameExpression":"EventName","traceIdExpression":"TraceId","spanIdExpression":"SpanId","connection":"ClickHouse","traceSourceId":"Traces","metricSourceId":"Metrics"},{"from":{"databaseName":"otel","tableName":"otel_traces"},"kind":"trace","timestampValueExpression":"Timestamp","name":"Traces","displayedTimestampValueExpression":"Timestamp","implicitColumnExpression":"SpanName","serviceNameExpression":"ServiceName","eventAttributesExpression":"SpanAttributes","resourceAttributesExpression":"ResourceAttributes","defaultTableSelectExpression":"Timestamp,ServiceName,StatusCode,round(Duration/1e6),SpanName","traceIdExpression":"TraceId","spanIdExpression":"SpanId","durationExpression":"Duration","durationPrecision":9,"parentSpanIdExpression":"ParentSpanId","spanNameExpression":"SpanName","spanKindExpression":"SpanKind","statusCodeExpression":"StatusCode","statusMessageExpression":"StatusMessage","spanEventsValueExpression":"Events","spanLinksValueExpression":"Links","connection":"ClickHouse","logSourceId":"Logs","metricSourceId":"Metrics"},{"from":{"databaseName":"otel","tableName":""},"kind":"metric","timestampValueExpression":"TimeUnix","name":"Metrics","serviceNameExpression":"ServiceName","resourceAttributesExpression":"ResourceAttributes","metricTables":{"gauge":"otel_metrics_gauge","sum":"otel_metrics_sum","histogram":"otel_metrics_histogram"},"minAutoGranularity":"10 second","connection":"ClickHouse","logSourceId":"Logs"}]'
    ports:
      - "8080:8080"
    depends_on:
      clickstack-mongo:
        condition: service_started
      clickstack-otel-collector:
        condition: service_started

volumes:
  clickhouse-data:
  clickstack-mongo-data:
