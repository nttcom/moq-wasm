[package]
name = "moqt-bridge-live-ingest"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
bytes = "1"
clap = { version = "4.6.1", features = ["derive", "env"] }
tokio = { version = "1.52.3", features = ["full"] }
rml_rtmp = "0.8.0"
srt-tokio = "0.4.4"
futures = "0.3.32"
media-publisher = { path = "../../shared/media-publisher" }
mediapack = { path = "../../shared/mediapack", features = ["moqt"] }
transcode = { path = "../../shared/transcode" }
tracing = "0.1"
tracing-subscriber = "0.3"
