[package]
name = "vts"
version = "0.1.0"
edition = "2024"
description = "Verify Token Service: verifies MoQT client JWTs on behalf of the relay"

[dependencies]
anyhow = { workspace = true }
app-registry = { path = "../../crates/app-registry" }
auth-token = { path = "../../crates/auth-token" }
http-server = { path = "../../crates/http-server" }
hyper = { workspace = true, features = ["http1", "server"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
telemetry-otlp = { path = "../../crates/telemetry-otlp" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
tracing = { workspace = true }

[dev-dependencies]
app-registry = { path = "../../crates/app-registry", features = ["testing"] }
reqwest = { workspace = true, features = ["json"] }
telemetry-otlp = { path = "../../crates/telemetry-otlp", features = ["testing"] }
tracing-subscriber = { workspace = true, default-features = true }
