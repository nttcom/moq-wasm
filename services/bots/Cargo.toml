[package]
name = "bots"
version = "0.1.0"
edition = "2024"
description = "Starts, stops and reports the bots of a room on behalf of an app's server"

[dependencies]
anyhow = "1.0.102"
app-registry = { path = "../../crates/app-registry" }
auth-token = { path = "../../crates/auth-token" }
aws-lc-rs = "1.18.2"
base64 = "0.23.1"
bytes = "1"
http-body-util = "0.1.4"
http-server = { path = "../../crates/http-server" }
hyper = { version = "1.10.1", features = ["http1", "server"] }
job-launcher = { path = "../../crates/job-launcher" }
google-cloud = { path = "../../crates/google-cloud" }
object_store = { version = "0.14.2", default-features = false, features = ["fs", "gcp"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
telemetry-otlp = { path = "../../crates/telemetry-otlp" }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
app-registry = { path = "../../crates/app-registry", features = ["testing"] }
