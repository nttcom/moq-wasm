[package]
name = "console"
version = "0.1.0"
edition = "2024"
description = "Internal MoQ console: identifies an employee through IAP and serves their app from the app registry"

[dependencies]
anyhow = { workspace = true }
app-registry = { path = "../../crates/app-registry" }
auth-token = { path = "../../crates/auth-token" }
base64 = { workspace = true }
google-cloud = { path = "../../crates/google-cloud" }
http-body-util = { workspace = true }
http-server = { path = "../../crates/http-server" }
hyper = { workspace = true, features = ["http1", "server"] }
reqwest = { workspace = true, features = ["rustls", "json"] }
aws-lc-rs = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "fs"] }
tracing = { workspace = true }
telemetry-otlp = { path = "../../crates/telemetry-otlp" }

[dev-dependencies]
app-registry = { path = "../../crates/app-registry", features = ["testing"] }
google-cloud = { path = "../../crates/google-cloud", features = ["testing"] }
http-server = { path = "../../crates/http-server", features = ["testing"] }
