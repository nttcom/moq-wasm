[package]
name = "onvif-ingest"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
broadcast = { path = "../../crates/broadcast" }
bytes = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
gstreamer = { workspace = true }
gstreamer-app = { workspace = true }
moqt = { path = "../../crates/moqt" }
mediapack = { path = "../../crates/mediapack" }
rand = "0.10.1"
reqwest = { workspace = true, features = ["rustls"] }
roxmltree = "0.21.1"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha1 = "0.11.0"
time = { version = "0.3.47", features = ["formatting", "macros"] }
tracing = { workspace = true }
telemetry-otlp = { path = "../../crates/telemetry-otlp" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "io-util"] }

[dev-dependencies]
moqt = { path = "../../crates/moqt", features = ["self-signed-cert"] }
proptest = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["test-util", "time"] }
