[package]
name = "sip-gateway"
version = "0.1.0"
edition = "2024"
description = "Places telephone calls through a SIP trunk and bridges each call's audio to a MoQT room"

[dependencies]
anyhow = "1.0.102"
app-registry = { path = "../../crates/app-registry" }
auth-token = { path = "../../crates/auth-token", features = ["vts-client"] }
aws-lc-rs = "1.18.2"
broadcast = { path = "../../crates/broadcast" }
bytes = "1"
gstreamer = "0.25"
gstreamer-app = "0.25"
http-body-util = "0.1.4"
http-server = { path = "../../crates/http-server" }
hyper = { version = "1.10.1", features = ["http1", "server"] }
mediapack = { path = "../../crates/mediapack", features = ["moqt"] }
moqt = { path = "../../crates/moqt" }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
rsipstack = { version = "0.8.6", default-features = false, features = ["platform-tokio", "rustls-aws-lc-rs"] }
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustrtc = { version = "0.6.6", default-features = false, features = ["std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
telemetry-otlp = { path = "../../crates/telemetry-otlp" }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1.44"

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
app-registry = { path = "../../crates/app-registry", features = ["testing"] }
