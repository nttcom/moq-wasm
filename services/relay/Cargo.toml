[package]
name = "relay"
version = "0.1.0"
edition = "2024"

[dependencies]
moqt = { path = "../../crates/moqt", features = ["self-signed-cert"] }
auth-token = { path = "../../crates/auth-token", features = ["vts-client"] }
telemetry = { path = "../../crates/telemetry" }
telemetry-otlp = { path = "../../crates/telemetry-otlp" }
tokio = { workspace = true, features = ["full", "tracing"] }
tracing = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
dashmap = "6.2.1"
bytes = { workspace = true }
opentelemetry = { workspace = true, features = ["trace", "metrics"] }
tracing-opentelemetry = { workspace = true }
redis = { version = "1.2.2", features = ["tokio-comp", "connection-manager"] }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }

[dev-dependencies]
opentelemetry_sdk = { workspace = true, features = ["testing", "metrics"] }
tracing-subscriber = { workspace = true, default-features = true }
serde_json = { workspace = true }
telemetry-otlp = { path = "../../crates/telemetry-otlp", features = ["testing"] }
tokio = { workspace = true, features = ["test-util"] }
proptest = { workspace = true, features = ["std"] }
