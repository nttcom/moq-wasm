[package]
name = "relay"
version = "0.1.0"
edition = "2024"

[dependencies]
moqt = { path = "../../crates/moqt", features = ["self-signed-cert"] }
auth-token = { path = "../../crates/auth-token" }
telemetry = { path = "../../crates/telemetry" }
tokio = { version = "1.52.3", features = ["full", "tracing"] }
tracing = "0.1.44"
async-trait = "0.1.89"
anyhow = "1.0.102"
dashmap = "6.2.1"
bytes = "1"
opentelemetry = { version = "0.33.1", features = ["trace"] }
tracing-opentelemetry = "0.34.0"
redis = { version = "1.2.2", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
http-client = { path = "../../crates/http-client" }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
opentelemetry_sdk = "0.33.1"
tracing-subscriber = "0.3.23"
serde_json = "1"
tokio = { version = "1.52.3", features = ["test-util"] }
