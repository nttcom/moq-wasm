[package]
name = "recorder"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { workspace = true }
auth-token = { path = "../../crates/auth-token", features = ["vts-client"] }
aws-lc-rs = { workspace = true }
google-cloud = { path = "../../crates/google-cloud" }
futures-util = { workspace = true }
base64 = { workspace = true }
broadcast = { path = "../../crates/broadcast" }
bytes = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
http-body-util = { workspace = true }
http-server = { path = "../../crates/http-server" }
hyper = { workspace = true, features = ["http1", "server"] }
job-launcher = { path = "../../crates/job-launcher" }
mediapack = { path = "../../crates/mediapack", features = ["moqt"] }
moqt = { path = "../../crates/moqt" }
msf = { path = "../../crates/msf" }
object_store = { workspace = true, features = ["fs", "gcp"] }
reqwest = { workspace = true, features = ["json", "rustls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
transcode = { path = "../../crates/transcode" }
telemetry-otlp = { path = "../../crates/telemetry-otlp" }
url = { workspace = true }

[dev-dependencies]
http-server = { path = "../../crates/http-server", features = ["testing"] }
moqt = { path = "../../crates/moqt", features = ["self-signed-cert"] }
proptest = { workspace = true, features = ["std"] }
