[package]
name = "bot-dispatcher"
version = "0.1.0"
edition = "2024"
description = "Starts, stops and reports the bots of a room on behalf of an app's server"

[dependencies]
anyhow = { workspace = true }
app-registry = { path = "../../crates/app-registry" }
auth-token = { path = "../../crates/auth-token", features = ["vts-client"] }
aws-lc-rs = { workspace = true }
bytes = { workspace = true }
http-server = { path = "../../crates/http-server" }
hyper = { workspace = true, features = ["http1", "server"] }
job-launcher = { path = "../../crates/job-launcher" }
google-cloud = { path = "../../crates/google-cloud" }
object_store = { workspace = true, features = ["fs", "gcp"] }
reqwest = { workspace = true, features = ["json", "rustls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
telemetry-otlp = { path = "../../crates/telemetry-otlp" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
app-registry = { path = "../../crates/app-registry", features = ["testing"] }
