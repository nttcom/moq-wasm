[package]
name = "temporary-apps"
version = "0.1.0"
edition = "2024"
description = "Issues the tokens of temporary apps to anyone, so the examples run in a namespace of their own"

[dependencies]
anyhow = { workspace = true }
auth-token = { path = "../../crates/auth-token" }
http-server = { path = "../../crates/http-server" }
hyper = { workspace = true, features = ["http1", "server"] }
reqwest = { workspace = true, features = ["json", "rustls"] }
aws-lc-rs = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
telemetry-otlp = { path = "../../crates/telemetry-otlp" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
tracing = { workspace = true }


[dev-dependencies]
http-server = { path = "../../crates/http-server", features = ["testing"] }
