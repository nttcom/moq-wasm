[package]
name = "observability"
version = "0.1.0"
edition = "2024"
description = "Fills ClickHouse tables from the relays' OTLP stats snapshots and serves them over HTTP"

[dependencies]
anyhow = { workspace = true }
auth-token = { path = "../../crates/auth-token" }
http-body-util = { workspace = true }
http-server = { path = "../../crates/http-server" }
hyper = { workspace = true }
reqwest = { workspace = true, features = ["rustls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tracing = { workspace = true }
telemetry = { path = "../../crates/telemetry" }
telemetry-otlp = { path = "../../crates/telemetry-otlp" }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
