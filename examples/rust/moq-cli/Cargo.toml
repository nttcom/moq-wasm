[package]
name = "moq-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "moq-cli"
path = "src/main.rs"

[dependencies]
moq-wasm = { path = "../../../sdk/rust" }
moqt = { path = "../../../crates/moqt" }
telemetry = { path = "../../../crates/telemetry" }
telemetry-report = { path = "../../../crates/telemetry-report" }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, default-features = true, features = ["env-filter"] }
anyhow = { workspace = true, features = ["backtrace"] }
url = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
reqwest = { workspace = true, features = ["json", "rustls"] }
