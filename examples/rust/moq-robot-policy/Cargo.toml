[package]
name = "moq-robot-policy"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
moq-wasm = { path = "../../../sdk/rust" }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
