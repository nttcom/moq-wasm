<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Datagram vs Stream · MoQT Playground</title>
    <link rel="stylesheet" href="../../utils/theme.css" />
    <link rel="stylesheet" href="../../utils/components.css" />
    <link rel="stylesheet" href="../media/setup-guide.css" />
    <link rel="stylesheet" href="./datagram.css" />
  </head>
  <body data-title="Datagram vs Stream">
    <main class="page">
      <details class="card setup-toggle">
        <summary><h2>使い方</h2></summary>
        <ol class="usage">
          <li>
            <svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-play" /></svg>「開始」で 2 トラックを
            Publish / Subscribe
          </li>
          <li>
            <svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-crosshair" /></svg
            >パッドの上でカーソルを動かす
          </li>
          <li>
            <svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-zap" /></svg>パケットロスを入れて比べる
            <span
              class="tip"
              tabindex="0"
              role="img"
              aria-label="macOS は Network Link Conditioner、Linux は sudo tc qdisc add dev &lt;dev&gt; root netem loss 5% delay 30ms。ストリームは再送を待って止まり、datagram は欠けるだけで遅れません"
              data-tip="macOS は Network Link Conditioner、Linux は sudo tc qdisc add dev &lt;dev&gt; root netem loss 5% delay 30ms。ストリームは再送を待って止まり、datagram は欠けるだけで遅れません"
              ><svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-info" /></svg
            ></span>
          </li>
        </ol>
      </details>

      <section class="card">
        <div class="card-head">
          <h2>
            接続
            <span
              class="tip"
              tabindex="0"
              role="img"
              aria-label="このページが 2 トラックを Publish し、Relay 経由で自分で Subscribe します"
              data-tip="このページが 2 トラックを Publish し、Relay 経由で自分で Subscribe します"
              ><svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-info" /></svg
            ></span>
          </h2>
        </div>
        <div class="controls">
          <div class="relay">
            <div id="urlPresets"></div>
            <input type="url" id="url" aria-label="Relay URL" />
          </div>
          <div class="actions">
            <div class="button-row">
              <button type="button" id="startBtn" data-testid="datagram-start-button">
                <svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-play" /></svg>開始
              </button>
              <button type="button" id="stopBtn" class="danger" data-testid="datagram-stop-button" disabled>
                <svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-square" /></svg>停止
              </button>
            </div>
            <label class="inline-toggle"><input type="checkbox" id="autoMove" checked />自動で動かす</label>
          </div>
        </div>
        <p class="hint connection-status" id="status" data-testid="datagram-status">未接続</p>
      </section>

      <section class="compare">
        <article class="card lane" data-lane="stream">
          <div class="lane-head">
            <h2>Subgroup stream</h2>
            <span class="lane-tag">再送あり・順序保証</span>
          </div>
          <canvas class="pad" id="pad-stream" width="640" height="400"></canvas>
          <dl class="lane-stats" id="stats-stream" data-testid="datagram-stats-stream"></dl>
          <canvas class="chart" id="chart-stream" width="640" height="140"></canvas>
        </article>
        <article class="card lane" data-lane="datagram">
          <div class="lane-head">
            <h2>Datagram</h2>
            <span class="lane-tag">再送なし・1 オブジェクト 1 datagram</span>
          </div>
          <canvas class="pad" id="pad-datagram" width="640" height="400"></canvas>
          <dl class="lane-stats" id="stats-datagram" data-testid="datagram-stats-datagram"></dl>
          <canvas class="chart" id="chart-datagram" width="640" height="140"></canvas>
        </article>
      </section>
    </main>

    <script type="module" src="./main.ts"></script>
    <script type="module" src="../../utils/shell.ts"></script>
  </body>
</html>
