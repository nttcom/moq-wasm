<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whiteboard</title>
    <link rel="stylesheet" href="../media/media.css" />
    <link rel="stylesheet" href="./whiteboard.css" />
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <div>
          <span class="pill">Whiteboard</span>
          <h1>Whiteboard</h1>
          <p>描いた線を MoQT で共有し、途中参加した人にもボードを再現する</p>
        </div>
      </header>

      <section class="card connection">
        <div class="connection-relay">
          <div id="urlPresets"></div>
          <input type="url" id="url" aria-label="Relay URL" />
        </div>
        <div class="connection-room stack">
          <p class="hint">ルーム: <code id="room"></code></p>
          <div class="button-row">
            <button type="button" id="joinBtn" data-testid="whiteboard-join-button">参加</button>
            <button type="button" id="leaveBtn" data-testid="whiteboard-leave-button" disabled>退出</button>
          </div>
          <p class="hint" id="status" data-testid="whiteboard-status">未接続</p>
          <ul id="participants" class="participants" data-testid="whiteboard-participants"></ul>
        </div>
      </section>

      <section class="card stack board-card">
        <div class="toolbar">
          <button type="button" data-tool="pen" aria-pressed="true">ペン</button>
          <button type="button" data-tool="eraser" aria-pressed="false" data-testid="whiteboard-eraser-button">
            消しゴム
          </button>
          <label class="inline-field">色<input type="color" id="color" value="#0f766e" /></label>
          <label class="inline-field">太さ<input type="range" id="width" min="1" max="24" value="4" /></label>
          <button type="button" id="clearBtn" data-testid="whiteboard-clear-button" disabled>全消去</button>
          <span class="hint stroke-count" id="strokeCount" data-testid="whiteboard-stroke-count" data-count="0"
            >0 ストローク</span
          >
        </div>
        <canvas id="board" class="board" data-testid="whiteboard-canvas"></canvas>
      </section>
    </main>

    <script type="module" src="./main.ts"></script>
    <script type="module" src="../../utils/accessBar.ts"></script>
  </body>
</html>
