<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whiteboard · MoQT Playground</title>
    <link rel="stylesheet" href="../../utils/theme.css" />
    <link rel="stylesheet" href="../../utils/components.css" />
    <link rel="stylesheet" href="./whiteboard.css" />
  </head>
  <body data-title="Whiteboard" data-shell="wide">
    <main class="page">
      <section class="card connection">
        <div class="connection-relay">
          <div id="urlPresets"></div>
          <input type="url" id="url" aria-label="Relay URL" />
        </div>
        <div class="connection-room">
          <div class="room-row">
            <span class="status-label">ルーム</span>
            <code id="room"></code>
          </div>
          <div class="button-row">
            <button type="button" id="joinBtn" data-testid="whiteboard-join-button">
              <svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-log-in" /></svg>参加
            </button>
            <button type="button" id="leaveBtn" data-testid="whiteboard-leave-button" disabled>
              <svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-log-out" /></svg>退出
            </button>
          </div>
          <p class="hint" id="status" data-testid="whiteboard-status">未接続</p>
          <ul id="participants" class="participants" data-testid="whiteboard-participants"></ul>
        </div>
      </section>

      <section class="card board-card">
        <div class="toolbar" role="group" aria-label="描画ツール">
          <div class="tool-group">
            <button type="button" data-tool="pen" aria-pressed="true">
              <svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-pencil" /></svg>ペン
            </button>
            <button type="button" data-tool="eraser" aria-pressed="false" data-testid="whiteboard-eraser-button">
              <svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-eraser" /></svg>消しゴム
            </button>
          </div>
          <span class="toolbar-divider" aria-hidden="true"></span>
          <label class="inline-field">色<input type="color" id="color" value="#0f766e" /></label>
          <label class="inline-field">太さ<input type="range" id="width" min="1" max="24" value="4" /></label>
          <span class="toolbar-divider" aria-hidden="true"></span>
          <button type="button" id="clearBtn" class="danger" data-testid="whiteboard-clear-button" disabled>
            <svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-trash" /></svg>全消去
          </button>
          <span class="hint stroke-count" id="strokeCount" data-testid="whiteboard-stroke-count" data-count="0"
            >0 ストローク</span
          >
        </div>
        <canvas id="board" class="board" data-testid="whiteboard-canvas"></canvas>
      </section>
    </main>

    <script type="module" src="./main.ts"></script>
    <script type="module" src="../../utils/shell.ts"></script>
  </body>
</html>
