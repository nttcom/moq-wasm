<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recording Player · MoQT Playground</title>
    <link rel="stylesheet" href="../../utils/theme.css" />
    <link rel="stylesheet" href="./player.css" />
  </head>
  <body data-title="Recording Player" data-shell="wide">
    <div class="player-app flex flex-col">
      <header class="player-bar flex flex-wrap items-center gap-x-3 gap-y-1 px-4 py-2.5 text-sm">
        <h1 id="room-name" class="truncate text-[0.95rem] font-semibold">Recording</h1>
        <span class="badge">REPLAY</span>
        <span
          id="alignment"
          tabindex="0"
          title="Approximate alignment: source clocks have not been calibrated"
          class="player-muted cursor-help"
          >ⓘ</span
        >
        <span id="recorded-at" class="player-muted"></span>
        <span id="participants" class="player-muted"></span>
        <div id="member-chips" class="flex -space-x-1"></div>
        <output id="status" role="status" class="player-muted ml-auto truncate text-xs">Choose a recording.</output>
      </header>
      <div class="relative flex min-h-0 flex-1">
        <main class="player-stage relative min-w-0 flex-1">
          <div id="videos" class="grid h-full content-center gap-3 p-4"></div>
          <div
            id="stage-notice"
            class="pointer-events-none absolute left-1/2 top-4 hidden max-w-[80%] -translate-x-1/2 rounded-lg px-4 py-2 text-sm text-white shadow-lg"
          ></div>
          <div id="open-dialog" class="player-overlay absolute inset-0 z-10 flex items-center justify-center p-6">
            <form id="open" class="open-card max-h-full w-full max-w-lg space-y-5 overflow-y-auto">
              <div class="space-y-2">
                <span class="badge accent">Meeting の録画</span>
                <h2 class="text-2xl font-bold tracking-tight">録画を開く</h2>
                <p class="player-muted text-sm leading-relaxed">
                  合成せずに MoQ のまま保存した会議を、そのときの画面のまま再生します。Recorder が録画を FETCH で Relay
                  に再配信します。
                </p>
              </div>
              <label class="field-label">
                <span>Recorder URL</span>
                <input id="recorder" type="url" value="http://127.0.0.1:8096" required class="field" />
              </label>
              <label class="field-label">
                <span>Recording ID</span>
                <input id="recording" type="text" required placeholder="Enter recording ID" class="field" />
              </label>
              <div class="space-y-2">
                <div id="relayPresets"></div>
                <input id="relay" type="url" required aria-label="Relay URL" class="field" />
              </div>
              <label class="field-label">
                <span>Access token <span class="player-subtle font-normal">（任意）</span></span>
                <input id="token" type="password" autocomplete="off" placeholder="Optional" class="field" />
              </label>
              <p id="open-error" class="player-error hidden text-sm"></p>
              <button id="load" class="primary-button w-full">Open recording</button>
            </form>
          </div>
        </main>
        <aside id="sidebar" class="player-sidebar flex h-full w-80 shrink-0 flex-col">
          <div class="player-sidebar-head flex items-center px-3 py-2.5">
            <div class="segmented">
              <button type="button" data-tab="chat" class="sidebar-tab" aria-selected="true">Chat</button>
              <button type="button" data-tab="transcript" class="sidebar-tab" aria-selected="false">
                Transcription
              </button>
            </div>
          </div>
          <div class="flex min-h-0 flex-1 flex-col px-3 pb-3">
            <ol id="chat" class="event-list"></ol>
            <ol id="transcript" class="event-list hidden"></ol>
          </div>
        </aside>
      </div>
      <div class="player-controls flex items-center gap-3 px-4 py-3">
        <button id="play" type="button" aria-label="Play" title="Play" disabled class="round-button primary">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <polygon id="play-icon" points="6 3 20 12 6 21 6 3" />
          </svg>
        </button>
        <input
          id="seek"
          type="range"
          min="0"
          max="0"
          step="0.1"
          value="0"
          disabled
          aria-label="Position"
          class="min-w-0 flex-1"
        />
        <output id="position" class="player-muted shrink-0 font-mono text-sm tabular-nums">00:00 / 00:00</output>
        <button
          id="reopen"
          type="button"
          aria-label="Open another recording"
          title="Open another recording"
          class="round-button"
        >
          <svg class="h-5 w-5" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"
            />
          </svg>
        </button>
        <button
          id="toggle-sidebar"
          type="button"
          aria-label="Chat and transcription"
          aria-pressed="true"
          title="Chat and transcription"
          class="round-button"
        >
          <svg class="h-5 w-5" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
          </svg>
        </button>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
    <script type="module" src="../../utils/shell.ts"></script>
  </body>
</html>
