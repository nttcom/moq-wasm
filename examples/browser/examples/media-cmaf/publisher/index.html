<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media CMAF Publisher · MoQT Playground</title>
    <link rel="stylesheet" href="../../../utils/theme.css" />
    <link rel="stylesheet" href="../../../utils/components.css" />
  </head>
  <body data-title="Publisher" data-parent-title="Media CMAF" data-parent-href="../index.html">
    <main class="page">
      <div id="app">
        <form name="form" id="form" class="workspace">
          <div class="workspace-main">
            <section class="card">
              <div class="card-head">
                <h2>プレビュー</h2>
              </div>
              <div class="stage" id="preview-stage" data-placeholder="getUserMedia で表示">
                <video id="video" autoplay muted playsinline></video>
              </div>
            </section>

            <section class="card stack">
              <div class="card-head">
                <h2>
                  配信設定
                  <span
                    class="tip"
                    tabindex="0"
                    role="img"
                    aria-label="配信トラック: catalog / camera / camera_cmaf / camera_audio / camera_timeline"
                    data-tip="配信トラック: catalog / camera / camera_cmaf / camera_audio / camera_timeline"
                    ><svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-info" /></svg
                  ></span>
                </h2>
              </div>
              <div class="field-grid">
                <label
                  >Track Namespace
                  <input
                    type="text"
                    name="publish-track-namespace"
                    id="publish-track-namespace"
                    value=""
                    data-testid="publisher-namespace-input"
                  />
                </label>
                <label
                  >Keyframe Interval
                  <select name="keyframe-interval">
                    <option value="0.5">0.5s</option>
                    <option value="1" selected>1s</option>
                    <option value="2">2s</option>
                  </select>
                </label>
              </div>
              <div class="button-row">
                <button
                  type="button"
                  class="secondary"
                  id="startGetUserMediaBtn"
                  data-testid="publisher-get-user-media-button"
                >
                  <svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-camera" /></svg>getUserMedia
                </button>
                <button type="button" id="publishBtn" class="primary" data-testid="publisher-send-button">
                  <svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-radio" /></svg>Publish
                </button>
              </div>
            </section>

            <section class="card">
              <div class="card-head">
                <h2>コンソール</h2>
              </div>
              <div id="logPanel" data-testid="publisher-log-panel"></div>
            </section>
          </div>

          <aside class="workspace-side">
            <section class="card stack">
              <h2>接続</h2>
              <div id="urlPresets"></div>
              <input type="url" name="url" id="url" aria-label="Relay URL" data-testid="publisher-url-input" />
              <div class="button-row">
                <button type="button" id="connectBtn" data-testid="publisher-connect-button">
                  <svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-plug" /></svg>Connect
                </button>
                <button type="button" id="closeBtn" data-testid="publisher-close-button">
                  <svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-unplug" /></svg>Close
                </button>
              </div>
            </section>

            <section class="card stack">
              <h2>ステータス</h2>
              <div class="status-list">
                <div class="status-item">
                  <span class="status-label"
                    ><svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-plug" /></svg> 接続</span
                  >
                  <span id="publisher-connection-status" class="status-value" data-testid="publisher-connection-status"
                    >Not connected</span
                  >
                </div>
                <div class="status-item">
                  <span class="status-label"
                    ><svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-camera" /></svg> キャプチャ</span
                  >
                  <span id="publisher-capture-status" class="status-value" data-testid="publisher-capture-status"
                    >Capture idle</span
                  >
                </div>
                <div class="status-item">
                  <span class="status-label"
                    ><svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-radio" /></svg> Publish</span
                  >
                  <span id="publisher-send-status" class="status-value" data-testid="publisher-send-status"
                    >Not publishing</span
                  >
                </div>
              </div>
            </section>
          </aside>
        </form>
      </div>
    </main>

    <script type="module" src="../../../utils/consolePanel.ts"></script>
    <script type="module" src="./main.ts"></script>
    <script type="module" src="../../../utils/shell.ts"></script>
  </body>
</html>
