<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MOQT CMAF Subscriber</title>
    <link rel="stylesheet" href="../../../utils/theme.css" />
    <link rel="stylesheet" href="../../../utils/components.css" />
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <div>
          <span class="pill">CMAF Subscriber</span>
          <h1>MoQT CMAF Subscriber</h1>
          <p>Plays the CMAF video of a broadcast with <code>LivePlayer</code> through MSE.</p>
        </div>
      </header>
      <div id="app">
        <form name="form" id="form" class="control-grid subscriber-grid">
          <section class="card stack">
            <h2>Connection</h2>
            <div id="urlPresets"></div>
            <input type="url" name="url" id="url" aria-label="Relay URL" data-testid="subscriber-url-input" />
            <div class="button-row">
              <button type="button" id="connectBtn" data-testid="subscriber-connect-button">Connect</button>
              <button type="button" id="closeBtn">Close</button>
            </div>
          </section>

          <section class="card stack">
            <h2>Status</h2>
            <div class="status-list">
              <div class="status-item">
                <span class="status-label">Connection</span>
                <span id="subscriber-connection-status" class="status-value" data-testid="subscriber-connection-status">
                  Not connected
                </span>
              </div>
              <div class="status-item">
                <span class="status-label">Catalog</span>
                <span id="catalog-track-status" class="status-value" data-testid="subscriber-catalog-status">
                  Catalog not loaded yet
                </span>
              </div>
              <div class="status-item">
                <span class="status-label">Playback</span>
                <span id="subscriber-playback-status" class="status-value" data-testid="subscriber-playback-status">
                  Playback idle
                </span>
              </div>
            </div>
          </section>

          <section class="card stack full">
            <h3>SUBSCRIBE</h3>
            <label
              >Track Namespace:
              <input
                type="text"
                name="subscribe-track-namespace"
                id="subscribe-track-namespace"
                value=""
                data-testid="subscriber-namespace-input"
              />
            </label>
            <div class="button-row action-row">
              <button type="button" id="sendSubscribeBtn" data-testid="subscriber-track-subscribe-button">
                Subscribe
              </button>
            </div>
          </section>

          <section class="card stack full">
            <h2>Playback</h2>
            <div class="media-grid">
              <section class="playback-panel stack">
                <div class="playback-meta">
                  <strong>Video</strong>
                </div>
                <div id="stage" data-testid="subscriber-stage"></div>
              </section>
              <section class="playback-panel stack">
                <div class="playback-meta">
                  <strong>Playout</strong>
                  <span id="playout-stats" data-testid="subscriber-playout-stats">Waiting for media</span>
                </div>
              </section>
            </div>
          </section>
          <section class="card stack full">
            <h2>Console</h2>
            <p class="hint">info / warn / error を表示します。</p>
            <div id="logPanel" data-testid="subscriber-log-panel"></div>
          </section>
        </form>
      </div>
    </div>

    <script type="module" src="../../../utils/consolePanel.ts"></script>
    <script type="module" src="./main.ts"></script>
    <script type="module" src="../../../utils/shell.ts"></script>
  </body>
</html>
