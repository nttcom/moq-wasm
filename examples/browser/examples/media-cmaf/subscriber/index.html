<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media CMAF Subscriber · MoQT Playground</title>
    <link rel="stylesheet" href="../../../utils/theme.css" />
    <link rel="stylesheet" href="../../../utils/components.css" />
    <link rel="stylesheet" href="../../media/media.css" />
  </head>
  <body data-title="Subscriber" data-parent-title="Media CMAF" data-parent-href="../index.html">
    <main class="page">
      <div id="app">
        <form name="form" id="form" class="workspace">
          <div class="workspace-main">
            <section class="card">
              <div class="card-head">
                <h2>再生</h2>
              </div>
              <div
                id="stage"
                class="stage"
                data-testid="subscriber-stage"
                data-placeholder="Subscribe するとここに映ります"
              ></div>
              <p class="playback-stats" id="playout-stats" data-testid="subscriber-playout-stats">Waiting for media</p>
            </section>

            <section class="card stack">
              <div class="card-head">
                <h2>購読</h2>
              </div>
              <label
                >Track Namespace
                <input
                  type="text"
                  name="subscribe-track-namespace"
                  id="subscribe-track-namespace"
                  value=""
                  data-testid="subscriber-namespace-input"
                />
              </label>
              <div class="button-row">
                <button type="button" id="sendSubscribeBtn" data-testid="subscriber-track-subscribe-button">
                  <svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-play" /></svg>Subscribe
                </button>
              </div>
            </section>

            <section class="card">
              <div class="card-head">
                <h2>コンソール</h2>
              </div>
              <div id="logPanel" data-testid="subscriber-log-panel"></div>
            </section>
          </div>

          <aside class="workspace-side">
            <section class="card stack">
              <h2>接続</h2>
              <div id="urlPresets"></div>
              <input type="url" name="url" id="url" aria-label="Relay URL" data-testid="subscriber-url-input" />
              <div class="button-row">
                <button type="button" id="connectBtn" data-testid="subscriber-connect-button">
                  <svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-plug" /></svg>Connect
                </button>
                <button type="button" id="closeBtn">
                  <svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-unplug" /></svg>Close
                </button>
              </div>
            </section>

            <section class="card stack">
              <h2>ステータス</h2>
              <div class="status-list">
                <div class="status-item">
                  <span class="status-label"
                    ><svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-plug" /></svg> 接続</span
                  >
                  <span
                    id="subscriber-connection-status"
                    class="status-value"
                    data-testid="subscriber-connection-status"
                    >Not connected</span
                  >
                </div>
                <div class="status-item">
                  <span class="status-label"
                    ><svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-list" /></svg> Catalog</span
                  >
                  <span id="catalog-track-status" class="status-value" data-testid="subscriber-catalog-status"
                    >Catalog not loaded yet</span
                  >
                </div>
                <div class="status-item">
                  <span class="status-label"
                    ><svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-play" /></svg> 再生</span
                  >
                  <span id="subscriber-playback-status" class="status-value" data-testid="subscriber-playback-status"
                    >Playback idle</span
                  >
                </div>
              </div>
            </section>
          </aside>
        </form>
      </div>
    </main>

    <script type="module" src="../../../utils/consolePanel.ts"></script>
    <script type="module" src="./main.ts"></script>
    <script type="module" src="../../../utils/shell.ts"></script>
  </body>
</html>
