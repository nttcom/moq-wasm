<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media CMAF · MoQT Playground</title>
    <link rel="stylesheet" href="../../utils/theme.css" />
    <link rel="stylesheet" href="../../utils/components.css" />
  </head>
  <body data-title="Media CMAF">
    <main class="page">
      <header class="hero">
        <div>
          <span class="pill">低レベル API · Media CMAF</span>
          <h1>CMAF トラックを MSE で再生</h1>
          <p>2 つのタブで Publisher と Subscriber を開きます</p>
        </div>
      </header>
      <div>
        <div class="choice-grid">
          <a class="card link-card choice" href="./publisher/index.html">
            <span class="choice-icon" aria-hidden="true"
              ><svg><use href="/icons.svg#icon-film" /></svg
            ></span>
            <h2>Publisher</h2>
            <p>LOC と CMAF のトラックを並べて Publish</p>
          </a>
          <a class="card link-card choice" href="./subscriber/index.html">
            <span class="choice-icon" aria-hidden="true"
              ><svg><use href="/icons.svg#icon-monitor" /></svg
            ></span>
            <h2>Subscriber</h2>
            <p>CMAF の映像を MSE で再生</p>
          </a>
        </div>
        <ol class="steps" aria-label="使い方">
          <li>
            <span
              ><svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-radio" /></svg> <b>Publisher</b> で
              Publish</span
            >
          </li>
          <li>
            <span
              ><svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-copy" /></svg>
              <b>Track Namespace</b> をコピー</span
            >
          </li>
          <li>
            <span
              ><svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-play" /></svg> <b>Subscriber</b> で
              Subscribe</span
            >
          </li>
        </ol>
      </div>
    </main>
    <script type="module" src="../../utils/preserveQueryLinks.js"></script>
    <script type="module" src="../../utils/shell.ts"></script>
  </body>
</html>
