<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Voice Agent · MoQT Playground</title>
    <link rel="stylesheet" href="../../utils/theme.css" />
    <link rel="stylesheet" href="../../utils/components.css" />
    <link rel="stylesheet" href="../media/setup-guide.css" />
    <link rel="stylesheet" href="./voice-agent.css" />
  </head>
  <body data-title="AI Voice Agent">
    <main class="page">
      <details class="card setup-toggle">
        <summary>
          <h2>使い方</h2>
        </summary>
        <div class="setup-routes">
          <details class="setup-panel setup-toggle" open>
            <summary>
              <h3 class="setup-flow">
                <span class="setup-node setup-node-local"
                  ><svg aria-hidden="true"><use href="/icons.svg#icon-monitor" /></svg>Browser<small>Mic</small></span
                >
                <span class="setup-arrow" aria-hidden="true">↔</span>
                <span class="setup-node setup-node-cloud"
                  ><svg aria-hidden="true"><use href="/icons.svg#icon-server" /></svg>Relay<small>MoQT</small></span
                >
                <span class="setup-arrow" aria-hidden="true">↔</span>
                <span class="setup-node setup-node-local"
                  ><svg aria-hidden="true"><use href="/icons.svg#icon-workflow" /></svg>pipecat bot<small
                    >Python</small
                  ></span
                >
                <span class="setup-arrow" aria-hidden="true">↔</span>
                <span class="setup-node setup-node-cloud"
                  ><svg aria-hidden="true"><use href="/icons.svg#icon-brain-circuit" /></svg>Gemini<small
                    >STT / LLM / TTS</small
                  ></span
                >
              </h3>
            </summary>
            <ol class="setup-steps">
              <li>
                <h4>pipecat bot を起動する</h4>
                <p class="hint">
                  bot サービス（<code>services/bots</code>）の <code>BOTS_TYPES</code> に登録します（<a
                    href="https://github.com/nttcom/moq-wasm/blob/master/examples/python/moq-ai-voice-agent/README.md"
                    target="_blank"
                    rel="noopener"
                    >README</a
                  >）
                </p>
              </li>
              <li>
                <h4>話しかける</h4>
                <p class="hint">一時アプリのページで Join し、「bot を参加させる」を押します</p>
              </li>
            </ol>
          </details>
        </div>
      </details>
      <div class="workspace">
        <div class="workspace-main">
          <section class="card stack">
            <h2>会話</h2>
            <ol id="transcript" class="voice-agent-transcript" data-testid="voice-agent-transcript"></ol>
            <p id="transcript-empty" class="hint">まだ会話はありません</p>
            <div id="bot-player" hidden></div>
          </section>
        </div>
        <aside class="workspace-side">
          <section class="card stack">
            <h2>接続</h2>
            <div id="urlPresets"></div>
            <input type="url" id="url" aria-label="Relay URL" data-testid="voice-agent-url-input" />
            <div class="button-row">
              <button type="button" id="joinBtn" data-testid="voice-agent-join-button">
                <svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-log-in" /></svg>Join
              </button>
              <button type="button" id="leaveBtn" data-testid="voice-agent-leave-button" disabled>
                <svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-log-out" /></svg>Leave
              </button>
              <button type="button" id="muteBtn" class="secondary" data-testid="voice-agent-mute-button" disabled>
                ミュート
              </button>
              <button type="button" id="botBtn" class="secondary" data-testid="voice-agent-bot-button" disabled>
                <svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-plus" /></svg>bot を参加させる
              </button>
            </div>
            <div class="status-list">
              <span id="connection-status" class="status-dot" data-state="idle">未接続</span>
              <span id="bot-status" class="status-dot" data-state="idle" data-testid="voice-agent-bot-status"
                >bot 未接続</span
              >
              <span id="bot-room" class="status-dot" data-state="review"></span>
            </div>
          </section>
        </aside>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
    <script type="module" src="../../utils/shell.ts"></script>
  </body>
</html>
