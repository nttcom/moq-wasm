<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Message · MoQT Playground</title>
    <link rel="stylesheet" href="../../utils/theme.css" />
    <link rel="stylesheet" href="../../utils/components.css" />
    <style>
      .message-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .message-grid > .wide {
        grid-column: 1 / -1;
      }

      .message-split {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      /* The side column is taller than the window, so it scrolls with the page. */
      .workspace-side {
        position: static;
        max-height: none;
        overflow: visible;
      }

      #send-status {
        min-height: 1.5em;
        font-family: var(--font-mono);
        font-size: 0.8125rem;
        overflow-wrap: anywhere;
      }

      #send-status:empty::before {
        color: var(--text-subtle);
        content: '未送信';
      }

      @media (max-width: 720px) {
        .message-grid,
        .message-split {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body data-title="Message">
    <main class="page">
      <div id="app">
        <form name="form" id="form" class="workspace">
          <div class="workspace-main">
            <section class="card">
              <div class="card-head">
                <h2>Namespace</h2>
              </div>
              <div class="message-grid">
                <section class="panel">
                  <div class="panel-head">
                    <h3>
                      announce
                      <span
                        class="tip"
                        tabindex="0"
                        role="img"
                        aria-label="Announce: PUBLISH_NAMESPACE / Withdraw: PUBLISH_NAMESPACE_DONE"
                        data-tip="Announce: PUBLISH_NAMESPACE / Withdraw: PUBLISH_NAMESPACE_DONE"
                        ><svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-info" /></svg
                      ></span>
                    </h3>
                  </div>
                  <label class="stacked"
                    >Track Namespace <input type="text" id="announce-namespace" value="anon/vc/aa"
                  /></label>
                  <div class="button-row action-row">
                    <button type="button" id="announceBtn">
                      <svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-radio" /></svg>Announce
                    </button>
                    <button type="button" id="withdrawBtn">
                      <svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-x" /></svg>Withdraw
                    </button>
                  </div>
                </section>

                <section class="panel">
                  <div class="panel-head">
                    <h3>
                      watchNamespaces
                      <span
                        class="tip"
                        tabindex="0"
                        role="img"
                        aria-label="Watch: SUBSCRIBE_NAMESPACE / Stop: UNSUBSCRIBE_NAMESPACE"
                        data-tip="Watch: SUBSCRIBE_NAMESPACE / Stop: UNSUBSCRIBE_NAMESPACE"
                        ><svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-info" /></svg
                      ></span>
                    </h3>
                  </div>
                  <label class="stacked"
                    >Track Namespace Prefix <input type="text" id="watch-prefix" value="anon/vc"
                  /></label>
                  <div class="button-row action-row">
                    <button type="button" id="watchBtn">
                      <svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-eye" /></svg>Watch
                    </button>
                    <button type="button" id="unwatchBtn">
                      <svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-square" /></svg>Stop
                    </button>
                  </div>
                </section>
              </div>
            </section>

            <section class="card">
              <div class="card-head">
                <h2>Publish</h2>
              </div>
              <section class="panel">
                <div class="panel-head">
                  <h3>
                    publishTrack
                    <span
                      class="tip"
                      tabindex="0"
                      role="img"
                      aria-label="SUBSCRIBE / FETCH / TRACK_STATUS に応答（チェックで PUBLISH も送信）"
                      data-tip="SUBSCRIBE / FETCH / TRACK_STATUS に応答（チェックで PUBLISH も送信）"
                      ><svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-info" /></svg
                    ></span>
                  </h3>
                </div>
                <div class="field-grid">
                  <label>Track Namespace <input type="text" id="publish-namespace" value="anon/vc/aa" /></label>
                  <label>Track Name <input type="text" id="publish-track" value="track" /></label>
                  <label>Retention (ms) <input type="text" id="publish-retention" value="60000" /></label>
                </div>
                <div class="button-row action-row">
                  <button type="button" id="publishTrackBtn">
                    <svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-upload" /></svg>Publish track
                  </button>
                  <label class="inline-toggle"><input type="checkbox" id="publish-publish" /> Send PUBLISH</label>
                </div>
                <hr class="divider" />
                <div class="field-grid">
                  <label>Payload <input type="text" id="write-payload" value="hello" /></label>
                </div>
                <div class="button-row action-row">
                  <button type="button" id="writeBtn">
                    <svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-pencil" /></svg>write
                  </button>
                  <button type="button" id="writeGroupBtn">
                    <svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-plus" /></svg>writeGroup
                  </button>
                  <label class="inline-toggle"><input type="checkbox" id="write-new-group" checked /> New group</label>
                </div>
              </section>
            </section>

            <section class="card">
              <div class="card-head">
                <h2>Subscribe</h2>
              </div>
              <div class="message-grid">
                <section class="panel wide">
                  <div class="panel-head">
                    <h3>
                      subscribe
                      <span
                        class="tip"
                        tabindex="0"
                        role="img"
                        aria-label="Set forward: SUBSCRIBE_UPDATE / Unsubscribe: UNSUBSCRIBE"
                        data-tip="Set forward: SUBSCRIBE_UPDATE / Unsubscribe: UNSUBSCRIBE"
                        ><svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-info" /></svg
                      ></span>
                    </h3>
                  </div>
                  <div class="field-grid">
                    <label>Track Namespace <input type="text" id="subscribe-namespace" value="anon/vc/aa" /></label>
                    <label>Track Name <input type="text" id="subscribe-track" value="track" /></label>
                    <label
                      >Filter
                      <select id="subscribe-filter">
                        <option value="largestObject" selected>Largest Object</option>
                        <option value="nextGroupStart">Next Group Start</option>
                      </select>
                    </label>
                    <label>Subscriber Priority <input type="text" id="subscribe-priority" value="128" /></label>
                  </div>
                  <div class="button-row action-row">
                    <button type="button" id="subscribeBtn">
                      <svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-play" /></svg>Subscribe
                    </button>
                    <button type="button" id="setForwardBtn">
                      <svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-refresh-cw" /></svg>Set forward
                    </button>
                    <button type="button" id="unsubscribeBtn">
                      <svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-square" /></svg>Unsubscribe
                    </button>
                    <label class="inline-toggle"
                      ><input type="checkbox" id="subscribe-forward" checked /> Forward</label
                    >
                  </div>
                </section>

                <section class="panel wide">
                  <div class="panel-head">
                    <h3>
                      fetch
                      <span
                        class="tip"
                        tabindex="0"
                        role="img"
                        aria-label="End Object 0 = End Group 全体"
                        data-tip="End Object 0 = End Group 全体"
                        ><svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-info" /></svg
                      ></span>
                    </h3>
                  </div>
                  <div class="field-grid">
                    <label>Track Namespace <input type="text" id="fetch-namespace" value="anon/vc/aa" /></label>
                    <label>Track Name <input type="text" id="fetch-track" value="track" /></label>
                  </div>
                  <div class="field-grid">
                    <label>Start Group <input type="text" id="fetch-start-group" value="0" /></label>
                    <label>Start Object <input type="text" id="fetch-start-object" value="0" /></label>
                    <label>End Group <input type="text" id="fetch-end-group" value="0" /></label>
                    <label>End Object <input type="text" id="fetch-end-object" value="0" /></label>
                  </div>
                  <div class="button-row action-row">
                    <button type="button" id="fetchBtn">
                      <svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-download" /></svg>Fetch
                    </button>
                  </div>
                </section>

                <section class="panel wide">
                  <div class="panel-head">
                    <h3>trackStatus</h3>
                  </div>
                  <div class="field-grid">
                    <label>Track Namespace <input type="text" id="track-status-namespace" value="anon/vc/aa" /></label>
                    <label>Track Name <input type="text" id="track-status-track" value="track" /></label>
                  </div>
                  <div class="button-row action-row">
                    <button type="button" id="trackStatusBtn">
                      <svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-search" /></svg>Track status
                    </button>
                  </div>
                </section>
              </div>
            </section>
          </div>

          <aside class="workspace-side">
            <section class="card stack">
              <h2>接続</h2>
              <div id="urlPresets"></div>
              <input type="url" name="url" id="url" aria-label="Relay URL" />
              <div class="button-row">
                <button type="button" id="connectBtn">
                  <svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-plug" /></svg>Connect
                </button>
                <button type="button" id="closeBtn">
                  <svg class="icon" aria-hidden="true"><use href="/icons.svg#icon-unplug" /></svg>Close
                </button>
              </div>
            </section>

            <section class="card stack">
              <h2>最後のリクエスト</h2>
              <p id="send-status" class="hint"></p>
            </section>

            <section class="card stack">
              <h2>受信したオブジェクト</h2>
              <div id="received-text" class="feed" data-empty="受信オブジェクトなし"></div>
            </section>

            <section class="card stack">
              <div class="card-head">
                <h2>コンソール</h2>
              </div>
              <div id="logPanel"></div>
            </section>
          </aside>
        </form>
      </div>
    </main>

    <script type="module" src="../../utils/consolePanel.ts"></script>
    <script type="module" src="./main.ts"></script>
    <script type="module" src="../../utils/shell.ts"></script>
  </body>
</html>
