[project]
name = "moqt-stt-server"
version = "0.1.0"
description = "FastAPI app that receives MoQT audio tracks and runs a VAD → STT → LLM → TTS voice pipeline, publishing results back over MoQT"
requires-python = ">=3.10"
dependencies = [
    "av>=14",
    "fastapi>=0.115",
    "faster-whisper>=1.1",
    "google-genai>=1.0",
    "httpx>=0.27",
    "moqt",
    "numpy>=1.26",
    "onnxruntime<1.24",
    "uvicorn>=0.30",
]

[tool.uv.sources]
moqt = { path = "../../../bindings/python" }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
