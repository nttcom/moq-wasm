[project]
name = "moq-ai-voice-agent"
version = "0.1.0"
description = "pipecat bot that talks with the MoQ AI Voice Agent page through Gemini speech-to-text, LLM and text-to-speech"
requires-python = ">=3.11"
dependencies = [
    "moq-bot-job",
    "moq-system-one-bot",
    "moq-wasm[pipecat]",
    "pipecat-ai[google,silero]>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.uv]
# pipecat-ai caps Pillow below 13, and only Pillow 13 fixes CVE-2026-112403. Drop this once
# pipecat-ai allows Pillow 13.
override-dependencies = ["pillow>=13"]

[tool.uv.sources]
moq-bot-job = { path = "../moq-bot-job", editable = true }
moq-system-one-bot = { path = "../moq-system-one-bot", editable = true }
moq-wasm = { path = "../../../crates/python" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
