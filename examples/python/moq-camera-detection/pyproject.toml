[project]
name = "moq-camera-detection"
version = "0.1.0"
description = "pipecat bot that judges whether a person is visible in MoQ camera video with d3-flash"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.11",
    "av>=14",
    "moq-bot-rooms",
    "moqt",
    "pipecat-ai>=1.12",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.uv.sources]
moq-bot-rooms = { path = "../moq-bot-rooms", editable = true }
moqt = { path = "../../../crates/python" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
