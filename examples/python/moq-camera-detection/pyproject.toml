[project]
name = "moq-camera-detection"
version = "0.1.0"
description = "pipecat bot that judges whether a person is visible in MoQ camera video with djev-run"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.11",
    "av>=14",
    "pipecat-ai[moq]>=1.12",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
