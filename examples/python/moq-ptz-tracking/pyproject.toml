[project]
name = "moq-ptz-tracking"
version = "0.1.0"
description = "pipecat bot that pans and tilts an ONVIF camera toward a target found by d3-flash"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.11",
    "av>=14",
    "moq-bot-rooms",
    "pipecat-ai[moq]>=1.12",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.uv.sources]
moq-bot-rooms = { path = "../moq-bot-rooms", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
