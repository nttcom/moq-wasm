[project]
name = "moq-meeting-transcriber"
version = "0.1.0"
description = "pipecat bot that transcribes every participant of a MoQ Meeting room with Whisper and publishes the text as an MSF event timeline"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.11",
    "av>=14",
    "moq-bot-rooms",
    "faster-whisper~=1.2.1",
    "moqt",
    "pipecat-ai[silero]>=1.12",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.uv.sources]
moq-bot-rooms = { path = "../moq-bot-rooms", editable = true }
moqt = { path = "../../../crates/python" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
