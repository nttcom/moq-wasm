[project]
name = "haas-asr-server"
version = "0.1.0"
description = "Serves Haas-ja on a GPU over the OpenAI-compatible transcription API for moq-meeting-transcriber"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.11",
    "haas-asr",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
haas-asr-server = "haas_asr_server.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# haas-asr tests torch 2.14 and the Triton 3.8 it requires: Triton 3.9 refuses the autotune keys of
# flash-linear-attention 0.5.2's kernels, so the model fails to load.
constraint-dependencies = ["torch==2.14.0"]
# NeMo 2.7.3's CUDA-graph decoder corrupts Python's shared b" " when a module is compiled at run
# time, so every module is compiled at install time, as haas-asr's own repository does.
compile-bytecode = true
# Copied from haas-asr, whose tested overrides of NeMo's pins apply to its own repository only.
override-dependencies = [
    "fsspec[http]>=2026.6.0",
    "hydra-core>=1.3.8",
    "packaging>=26.3",
    "transformers>=5.10.0",
]

[tool.uv.sources]
haas-asr = { git = "https://github.com/third-intelligence/Haas-ASR.git", rev = "acc614f68769dcbfae9dba96b48439c4a66295af" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
