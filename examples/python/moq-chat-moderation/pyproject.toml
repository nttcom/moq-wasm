[project]
name = "moq-chat-moderation"
version = "0.1.0"
description = "pipecat bot that judges MoQ chat messages with d3-flash and publishes the verdicts as an MSF event timeline"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.11",
    "moq-bot-rooms",
    "moq-system-one-bot",
    "moqt",
    "pipecat-ai>=1.12",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.uv]
# pipecat-ai caps Pillow below 13, and only Pillow 13 fixes CVE-2026-112403. Drop this once
# pipecat-ai allows Pillow 13.
override-dependencies = ["pillow>=13"]

[tool.uv.sources]
moq-bot-rooms = { path = "../moq-bot-rooms", editable = true }
moq-system-one-bot = { path = "../moq-system-one-bot", editable = true }
moqt = { path = "../../../crates/python" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
