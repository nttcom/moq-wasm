[project]
name = "moq-system-one-bot"
version = "0.1.0"
description = "What the MoQ bots that call a System One service share: its client, status track, event timeline, identity tokens, relay reconnection, following a published namespace and turning H.264 into JPEG pictures"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.11",
    "av>=14",
    "moq-bot-rooms",
    "moq-wasm",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.uv.sources]
moq-bot-rooms = { path = "../moq-bot-rooms", editable = true }
moq-wasm = { path = "../../../crates/python" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
