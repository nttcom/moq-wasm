[project]
name = "moq-system-one-bot"
version = "0.1.0"
description = "What the MoQ bots that call a System One service share: its status track, identity tokens and following a published namespace"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.11",
    "moq-bot-rooms",
    "moqt",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.uv.sources]
moq-bot-rooms = { path = "../moq-bot-rooms", editable = true }
moqt = { path = "../../../crates/python" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
