[project]
name = "moq-bot-job"
version = "0.1.0"
description = "What a MoQ bot that the bot service (services/bots) launches for one room needs: its calls to the service, its relay arguments, identity tokens and log reporting"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.11",
    "loguru>=0.7",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
