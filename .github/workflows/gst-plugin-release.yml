name: GStreamer plugin release

# `docs/architecture/gst-plugin-moqt/architecture.md` "Release".
on:
  push:
    tags:
      - "gst-plugin-moqt-v*"

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        # actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 = v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Check the tag names the crate version
        id: version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('crates/gst-plugin-moqt/Cargo.toml', 'rb'))['package']['version'])")
          if [ "${GITHUB_REF_NAME}" != "gst-plugin-moqt-v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not name the crate version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Check the changelog has the version's section
        run: node sdk/js/js/scripts/release-notes.mjs crates/gst-plugin-moqt/CHANGELOG.md "${{ steps.version.outputs.version }}"

  packages:
    needs: version
    uses: ./.github/workflows/gst-plugin.yml

  release:
    needs: [version, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout repository
        # actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 = v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Download the packages
        # actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c = v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: gst-plugin-*
          merge-multiple: true
          path: ${{ runner.temp }}/packages
      - name: Take the release notes from the changelog
        run: node sdk/js/js/scripts/release-notes.mjs crates/gst-plugin-moqt/CHANGELOG.md "${VERSION}" > "${RUNNER_TEMP}/notes.md"
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "${RUNNER_TEMP}"/packages/* \
            --verify-tag --latest=false \
            --title "gst-plugin-moqt ${VERSION}" --notes-file "${RUNNER_TEMP}/notes.md"
