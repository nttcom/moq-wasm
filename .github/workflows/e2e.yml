name: E2E

on:
  pull_request:
    paths:
      - ".github/workflows/e2e.yml"
      - ".github/workflows/relay-image.yml"
      - ".github/actions/setup-wasm-pack/**"
      - ".github/actions/install-playwright-chromium/**"
      - "README.md"
      - "scripts/setup-media-e2e.mjs"
      - "scripts/run-media-e2e.mjs"
      - "scripts/run-meeting-e2e.mjs"
      - "scripts/run-message-e2e.mjs"
      - "scripts/run-live-viewer-e2e.mjs"
      - "scripts/run-chat-moderation-e2e.mjs"
      - "scripts/run-camera-detection-e2e.mjs"
      - "scripts/browser-e2e-process.mjs"
      - "scripts/media-e2e-helpers.mjs"
      - "scripts/ensure-relay-certs.mjs"
      - "scripts/resolve-local-relay-url.mjs"
      - "scripts/chrome_linux.sh"
      - "scripts/cache-eviction-e2e.sh"
      - "scripts/cascading-relay-e2e.sh"
      - "scripts/fetch-e2e.sh"
      - "scripts/multiple-publishers-e2e.sh"
      - "scripts/moqtsink-e2e.sh"
      - "scripts/object-dedup-e2e.sh"
      - "docker-compose.yml"
      - "examples/browser/**"
      - "examples/python/moq-chat-moderation/**"
      - "examples/python/moq-camera-detection/**"
      - "bindings/wasm/**"
      - "bridges/live-ingest/**"
      - "bindings/gstreamer/**"
      - ".github/actions/install-ffmpeg-deps/**"
      - "relay/**"
      - "moqt/**"
      - "shared/**"
      - "tests/cache-eviction-e2e/**"
      - "tests/cascading-relay-e2e/**"
      - "tests/fetch-e2e/**"
      - "tests/multiple-publishers-e2e/**"
      - "tests/moqtsink-e2e/**"
      - "tests/object-dedup-e2e/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain"
  push:
    branches:
      - master
      - draft-*
      - example-e2e-ci
    paths:
      - ".github/workflows/e2e.yml"
      - ".github/workflows/relay-image.yml"
      - ".github/actions/setup-wasm-pack/**"
      - ".github/actions/install-playwright-chromium/**"
      - "README.md"
      - "scripts/setup-media-e2e.mjs"
      - "scripts/run-media-e2e.mjs"
      - "scripts/run-meeting-e2e.mjs"
      - "scripts/run-message-e2e.mjs"
      - "scripts/run-live-viewer-e2e.mjs"
      - "scripts/run-chat-moderation-e2e.mjs"
      - "scripts/run-camera-detection-e2e.mjs"
      - "scripts/browser-e2e-process.mjs"
      - "scripts/media-e2e-helpers.mjs"
      - "scripts/ensure-relay-certs.mjs"
      - "scripts/resolve-local-relay-url.mjs"
      - "scripts/chrome_linux.sh"
      - "scripts/cache-eviction-e2e.sh"
      - "scripts/cascading-relay-e2e.sh"
      - "scripts/fetch-e2e.sh"
      - "scripts/multiple-publishers-e2e.sh"
      - "scripts/moqtsink-e2e.sh"
      - "scripts/object-dedup-e2e.sh"
      - "docker-compose.yml"
      - "examples/browser/**"
      - "examples/python/moq-chat-moderation/**"
      - "examples/python/moq-camera-detection/**"
      - "bindings/wasm/**"
      - "bridges/live-ingest/**"
      - "bindings/gstreamer/**"
      - ".github/actions/install-ffmpeg-deps/**"
      - "relay/**"
      - "moqt/**"
      - "shared/**"
      - "tests/cache-eviction-e2e/**"
      - "tests/cascading-relay-e2e/**"
      - "tests/fetch-e2e/**"
      - "tests/multiple-publishers-e2e/**"
      - "tests/moqtsink-e2e/**"
      - "tests/object-dedup-e2e/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"
  CARGO_INCREMENTAL: "0"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      media: ${{ steps.filter.outputs.media }}
      message: ${{ steps.filter.outputs.message }}
      chat_moderation: ${{ steps.filter.outputs.chat_moderation }}
      camera_detection: ${{ steps.filter.outputs.camera_detection }}
      live_viewer: ${{ steps.filter.outputs.live_viewer }}
      meeting: ${{ steps.filter.outputs.meeting }}
      compose_suites: ${{ steps.filter.outputs.compose_suites }}
      relay_image: ${{ steps.relay_image.outputs.image }}
      relay_image_source: ${{ steps.relay_image.outputs.source || 'none' }}
    steps:
      - name: Checkout repository
        # actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 = v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed E2E inputs
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            media=true
            message=true
            chat_moderation=true
            camera_detection=true
            live_viewer=true
            meeting=true
            compose_suites=(cascading-relay auth cache-eviction fetch multiple-publishers moqtsink object-dedup)
          else
            base="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"

            if [[ -n "$base" && ! "$base" =~ ^0+$ ]] && git cat-file -e "$base^{commit}" 2>/dev/null; then
              git diff --name-only "$base" HEAD > changed-files.txt
            else
              git ls-tree -r --name-only HEAD > changed-files.txt
            fi

            media=false
            message=false
            chat_moderation=false
            camera_detection=false
            live_viewer=false
            meeting=false
            compose_suites=()

            while IFS= read -r path; do
              case "$path" in
                .github/workflows/e2e.yml|.github/actions/setup-wasm-pack/*|.github/actions/install-playwright-chromium/*|README.md|scripts/setup-media-e2e.mjs|scripts/run-media-e2e.mjs|scripts/vts-dev.mjs|scripts/browser-e2e-process.mjs|scripts/media-e2e-helpers.mjs|scripts/ensure-relay-certs.mjs|scripts/resolve-local-relay-url.mjs|scripts/chrome_linux.sh|examples/browser/*|bindings/wasm/*|relay/*|moqt/*|shared/*|services/vts/*|Cargo.toml|Cargo.lock|rust-toolchain)
                  media=true
                  ;;
              esac

              case "$path" in
                .github/workflows/e2e.yml|.github/actions/setup-wasm-pack/*|.github/actions/install-playwright-chromium/*|scripts/setup-media-e2e.mjs|scripts/run-message-e2e.mjs|scripts/vts-dev.mjs|scripts/browser-e2e-process.mjs|scripts/media-e2e-helpers.mjs|scripts/ensure-relay-certs.mjs|scripts/resolve-local-relay-url.mjs|scripts/chrome_linux.sh|examples/browser/*|bindings/wasm/*|relay/*|moqt/*|shared/*|services/vts/*|Cargo.toml|Cargo.lock|rust-toolchain)
                  message=true
                  ;;
              esac

              case "$path" in
                .github/workflows/e2e.yml|.github/actions/setup-wasm-pack/*|.github/actions/install-playwright-chromium/*|scripts/setup-media-e2e.mjs|scripts/run-chat-moderation-e2e.mjs|scripts/vts-dev.mjs|scripts/browser-e2e-process.mjs|scripts/media-e2e-helpers.mjs|scripts/ensure-relay-certs.mjs|scripts/resolve-local-relay-url.mjs|examples/browser/*|examples/python/moq-chat-moderation/*|bindings/wasm/*|relay/*|moqt/*|shared/*|services/vts/*|Cargo.toml|Cargo.lock|rust-toolchain)
                  chat_moderation=true
                  ;;
              esac

              case "$path" in
                .github/workflows/e2e.yml|.github/actions/setup-wasm-pack/*|.github/actions/install-playwright-chromium/*|scripts/setup-media-e2e.mjs|scripts/run-camera-detection-e2e.mjs|scripts/vts-dev.mjs|scripts/browser-e2e-process.mjs|scripts/media-e2e-helpers.mjs|scripts/ensure-relay-certs.mjs|scripts/resolve-local-relay-url.mjs|examples/browser/*|examples/python/moq-camera-detection/*|bindings/wasm/*|relay/*|moqt/*|shared/*|services/vts/*|Cargo.toml|Cargo.lock|rust-toolchain)
                  camera_detection=true
                  ;;
              esac

              case "$path" in
                .github/workflows/e2e.yml|.github/actions/setup-wasm-pack/*|.github/actions/install-playwright-chromium/*|.github/actions/install-ffmpeg-deps/*|scripts/setup-media-e2e.mjs|scripts/run-live-viewer-e2e.mjs|scripts/vts-dev.mjs|scripts/browser-e2e-process.mjs|scripts/media-e2e-helpers.mjs|scripts/ensure-relay-certs.mjs|scripts/resolve-local-relay-url.mjs|examples/browser/*|bindings/wasm/*|bridges/live-ingest/*|relay/*|moqt/*|shared/*|services/vts/*|Cargo.toml|Cargo.lock|rust-toolchain)
                  live_viewer=true
                  ;;
              esac

              case "$path" in
                .github/workflows/e2e.yml|.github/workflows/relay-image.yml|.github/actions/setup-wasm-pack/*|.github/actions/install-playwright-chromium/*|scripts/setup-media-e2e.mjs|scripts/run-meeting-e2e.mjs|scripts/vts-dev.mjs|scripts/media-e2e-helpers.mjs|scripts/ensure-relay-certs.mjs|scripts/resolve-local-relay-url.mjs|scripts/chrome_linux.sh|docker-compose.yml|examples/browser/*|bindings/wasm/*|relay/*|moqt/*|shared/*|services/*|Cargo.toml|Cargo.lock|rust-toolchain)
                  meeting=true
                  ;;
              esac

              case "$path" in
                .github/workflows/e2e.yml|.github/workflows/relay-image.yml|scripts/cascading-relay-e2e.sh|scripts/ensure-relay-certs.mjs|scripts/resolve-local-relay-url.mjs|docker-compose.yml|relay/*|moqt/*|shared/*|tests/cascading-relay-e2e/*|services/vts/*|Cargo.toml|Cargo.lock|rust-toolchain)
                  compose_suites+=(cascading-relay)
                  ;;
              esac

              case "$path" in
                .github/workflows/e2e.yml|.github/workflows/relay-image.yml|scripts/cache-eviction-e2e.sh|scripts/ensure-relay-certs.mjs|scripts/resolve-local-relay-url.mjs|docker-compose.yml|relay/*|moqt/*|shared/*|tests/cache-eviction-e2e/*|services/vts/*|Cargo.toml|Cargo.lock|rust-toolchain)
                  compose_suites+=(cache-eviction)
                  ;;
              esac

              case "$path" in
                .github/workflows/e2e.yml|.github/workflows/relay-image.yml|scripts/fetch-e2e.sh|scripts/ensure-relay-certs.mjs|scripts/resolve-local-relay-url.mjs|docker-compose.yml|relay/*|moqt/*|shared/*|tests/fetch-e2e/*|services/vts/*|Cargo.toml|Cargo.lock|rust-toolchain)
                  compose_suites+=(fetch)
                  ;;
              esac

              case "$path" in
                .github/workflows/e2e.yml|.github/workflows/relay-image.yml|scripts/multiple-publishers-e2e.sh|scripts/ensure-relay-certs.mjs|scripts/resolve-local-relay-url.mjs|docker-compose.yml|relay/*|moqt/*|shared/*|tests/multiple-publishers-e2e/*|services/vts/*|Cargo.toml|Cargo.lock|rust-toolchain)
                  compose_suites+=(multiple-publishers)
                  ;;
              esac

              case "$path" in
                .github/workflows/e2e.yml|.github/workflows/relay-image.yml|.github/actions/install-ffmpeg-deps/*|scripts/moqtsink-e2e.sh|scripts/ensure-relay-certs.mjs|scripts/resolve-local-relay-url.mjs|docker-compose.yml|relay/*|moqt/*|shared/*|bindings/gstreamer/*|tests/moqtsink-e2e/*|services/vts/*|Cargo.toml|Cargo.lock|rust-toolchain)
                  compose_suites+=(moqtsink)
                  ;;
              esac

              case "$path" in
                .github/workflows/e2e.yml|.github/workflows/relay-image.yml|scripts/object-dedup-e2e.sh|scripts/ensure-relay-certs.mjs|scripts/resolve-local-relay-url.mjs|docker-compose.yml|relay/*|moqt/*|shared/*|tests/object-dedup-e2e/*|services/vts/*|Cargo.toml|Cargo.lock|rust-toolchain)
                  compose_suites+=(object-dedup)
                  ;;
              esac

              case "$path" in
                .github/workflows/e2e.yml|.github/workflows/relay-image.yml|scripts/auth-e2e.sh|scripts/ensure-relay-certs.mjs|scripts/resolve-local-relay-url.mjs|docker-compose.yml|relay/*|moqt/*|shared/*|services/*|tests/auth-e2e/*|examples/rust/moq-cli/*|Cargo.toml|Cargo.lock|rust-toolchain)
                  compose_suites+=(auth)
                  ;;
              esac
            done < changed-files.txt
          fi

          relay=false
          [[ "$meeting" == "true" || ${#compose_suites[@]} -gt 0 ]] && relay=true

          {
            echo "media=$media"
            echo "message=$message"
            echo "chat_moderation=$chat_moderation"
            echo "camera_detection=$camera_detection"
            echo "live_viewer=$live_viewer"
            echo "meeting=$meeting"
            echo "compose_suites=$(jq -cn '$ARGS.positional | unique' --args "${compose_suites[@]}")"
            echo "relay=$relay"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve relay image
        id: relay_image
        if: ${{ steps.filter.outputs.relay == 'true' }}
        shell: bash
        env:
          # Tag = hash of every input that affects the relay binary.
          RELAY_IMAGE_TAG: ${{ hashFiles('relay/**', 'moqt/**', 'shared/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain', '.cargo/config.toml', '.dockerignore') }}
        run: |
          set -euo pipefail

          # GHCR namespaces must be lowercase.
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${repo}/relay:${RELAY_IMAGE_TAG}"

          if docker manifest inspect "$image" >/dev/null 2>&1; then
            source=published
          elif [[ "${{ github.event_name }}" == "pull_request" || ( "${{ github.event_name }}" == "push" && "${{ github.ref }}" != "refs/heads/master" ) ]]; then
            source=local
          else
            source=publish
          fi

          echo "Relay image ${image}: ${source}"
          {
            echo "image=$image"
            echo "source=$source"
          } >> "$GITHUB_OUTPUT"

  relay_image_local:
    needs: changes
    if: ${{ needs.changes.outputs.relay_image_source == 'local' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        # actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 = v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        # docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c = v4.2.0
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Build local relay image for E2E
        # Reads the dependency layers relay-image.yml caches on master; pull
        # requests do not write to the cache to stay within the repository quota.
        # docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a = v7.3.0
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: relay/Dockerfile
          load: true
          tags: moqt-relay:local-source
          cache-from: type=gha,scope=relay

      - name: Save relay image
        run: docker save moqt-relay:local-source | gzip > "${RUNNER_TEMP}/relay-image.tar.gz"

      - name: Upload relay image artifact
        # actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a = v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: relay-image-local
          path: ${{ runner.temp }}/relay-image.tar.gz
          retention-days: 1

  relay_image:
    needs: changes
    if: ${{ needs.changes.outputs.relay_image_source == 'publish' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/relay-image.yml
    with:
      image: ${{ needs.changes.outputs.relay_image }}

  media_e2e:
    needs: changes
    if: ${{ needs.changes.outputs.media == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        # actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 = v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Setup Node.js
        # actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 = v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/browser/package-lock.json

      - name: Setup Rust toolchain
        # dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 = v1
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        # Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 = v2.9.1
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install wasm-pack
        uses: ./.github/actions/setup-wasm-pack

      - name: Prepare media E2E environment
        run: node scripts/setup-media-e2e.mjs

      - name: Install Playwright Chromium
        uses: ./.github/actions/install-playwright-chromium

      - name: Run media E2E
        env:
          CI: "true"
        run: node scripts/run-media-e2e.mjs

      - name: Upload Playwright artifacts
        if: failure()
        # actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a = v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: media-e2e-artifacts
          path: |
            examples/browser/test-results
            examples/browser/playwright-report
          if-no-files-found: ignore

  live_viewer_e2e:
    needs: changes
    if: ${{ needs.changes.outputs.live_viewer == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        # actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 = v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Setup Node.js
        # actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 = v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/browser/package-lock.json

      - name: Setup Rust toolchain
        # dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 = v1
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        # Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 = v2.9.1
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install wasm-pack
        uses: ./.github/actions/setup-wasm-pack

      - name: Install media build dependencies
        uses: ./.github/actions/install-ffmpeg-deps

      - name: Prepare media E2E environment
        run: node scripts/setup-media-e2e.mjs

      - name: Build relay and live ingest
        # One invocation per package: run-live-viewer-e2e.mjs starts each with
        # its own `cargo run -p`, and a combined build unifies features
        # differently, which would recompile the dependencies at run time.
        run: |
          cargo build -p relay
          cargo build -p moqt-bridge-live-ingest

      - name: Install Playwright Chromium
        uses: ./.github/actions/install-playwright-chromium

      - name: Run live viewer E2E
        env:
          CI: "true"
        run: node scripts/run-live-viewer-e2e.mjs

      - name: Upload Playwright artifacts
        if: failure()
        # actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a = v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: live-viewer-e2e-artifacts
          path: |
            examples/browser/test-results
            examples/browser/playwright-report
          if-no-files-found: ignore

  message_e2e:
    needs: changes
    if: ${{ needs.changes.outputs.message == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        # actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 = v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Setup Node.js
        # actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 = v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/browser/package-lock.json

      - name: Setup Rust toolchain
        # dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 = v1
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        # Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 = v2.9.1
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install wasm-pack
        uses: ./.github/actions/setup-wasm-pack

      - name: Prepare browser E2E environment
        run: node scripts/setup-media-e2e.mjs

      - name: Install Playwright Chromium
        uses: ./.github/actions/install-playwright-chromium

      - name: Run message E2E
        env:
          CI: "true"
