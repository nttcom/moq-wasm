  meeting_e2e:
    needs: [changes, relay_image_local, relay_image]
    if: ${{ always() && needs.changes.outputs.meeting == 'true' && (needs.changes.outputs.relay_image_source == 'published' || (needs.changes.outputs.relay_image_source == 'local' && needs.relay_image_local.result == 'success') || (needs.changes.outputs.relay_image_source == 'publish' && needs.relay_image.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        # actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 = v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Setup Node.js
        # actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 = v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/browser/package-lock.json

      - name: Setup Rust toolchain
        # dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 = v1
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        # Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 = v2.9.1
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install wasm-pack
        uses: ./.github/actions/setup-wasm-pack

      - name: Prepare browser E2E environment
        run: node scripts/setup-media-e2e.mjs

      - name: Install Playwright Chromium
        uses: ./.github/actions/install-playwright-chromium

      - name: Download local relay image
        if: ${{ needs.changes.outputs.relay_image_source == 'local' }}
        # actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c = v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: relay-image-local
          path: ${{ runner.temp }}/relay-image

      - name: Load local relay image
        if: ${{ needs.changes.outputs.relay_image_source == 'local' }}
        run: |
          gunzip -c "${RUNNER_TEMP}/relay-image/relay-image.tar.gz" | docker load
          docker tag moqt-relay:local-source moqt-relay:local

      - name: Log in to GHCR
        if: ${{ needs.changes.outputs.relay_image_source != 'local' }}
        # docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 = v4.4.0
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published relay image
        if: ${{ needs.changes.outputs.relay_image_source != 'local' }}
        run: |
          docker pull "${{ needs.changes.outputs.relay_image }}"
          docker tag "${{ needs.changes.outputs.relay_image }}" moqt-relay:local

      - name: Log out from GHCR
        if: ${{ needs.changes.outputs.relay_image_source != 'local' }}
        run: docker logout ghcr.io

      - name: Run meeting E2E
        env:
          CI: "true"
        run: node scripts/run-meeting-e2e.mjs

      - name: Upload Playwright artifacts
        if: failure()
        # actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a = v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: meeting-e2e-artifacts
          path: |
            examples/browser/test-results
            examples/browser/playwright-report
          if-no-files-found: ignore

  compose_e2e:
    needs: [changes, relay_image_local, relay_image]
    if: ${{ always() && needs.changes.outputs.compose_suites != '[]' && (needs.changes.outputs.relay_image_source == 'published' || (needs.changes.outputs.relay_image_source == 'local' && needs.relay_image_local.result == 'success') || (needs.changes.outputs.relay_image_source == 'publish' && needs.relay_image.result == 'success')) }}
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.changes.outputs.compose_suites) }}
    runs-on: ubuntu-latest
