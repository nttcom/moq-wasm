name: Python bindings

on:
  pull_request:
    paths:
      - ".github/workflows/python.yml"
      - ".cargo/config.toml"
      - "crates/python/**"
      - "examples/python/moq-meeting-transcriber/**"
      - "examples/python/moq-bot-rooms/**"
      - "crates/moqt/**"
      - "crates/relay/**"
      - "crates/vts/**"
      - "docker-compose.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain"
      - "!**.md"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/python.yml"
      - ".cargo/config.toml"
      - "crates/python/**"
      - "examples/python/moq-meeting-transcriber/**"
      - "examples/python/moq-bot-rooms/**"
      - "crates/moqt/**"
      - "crates/relay/**"
      - "crates/vts/**"
      - "docker-compose.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain"
      - "!**.md"

concurrency:
  # Without the run_id fallback, master pushes would share one group and
  # each new push would cancel the previous master run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 = v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        # dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 = v1
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.99.1

      - name: Cache Rust build artifacts
        # Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 = v2.9.1
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Setup uv
        # astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 = v10.2.0
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: 0.13.4
          checksum: 2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f
          save-cache: ${{ github.ref == 'refs/heads/master' }}

      # The tests start a relay and a VTS built from this workspace.
      - name: Run binding tests
        working-directory: crates/python
        run: uv run pytest

      - name: Run transcriber unit tests
        working-directory: examples/python/moq-meeting-transcriber
        run: uv run pytest
