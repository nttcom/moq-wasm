name: Python bindings

on:
  pull_request:
    paths:
      - ".github/workflows/python.yml"
      - ".cargo/config.toml"
      - "sdk/python/**"
      - "examples/python/moq-meeting-transcriber/**"
      - "examples/python/moq-bot-job/**"
      - "examples/python/system-one-server/**"
      - "examples/python/haas-asr-server/**"
      - "crates/moqt/**"
      - "crates/broadcast/**"
      - "crates/mediapack/**"
      - "crates/msf/**"
      - "crates/telemetry-report/**"
      - "crates/telemetry/**"
      - "services/relay/**"
      - "services/vts/**"
      - "docker-compose.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain"
      - "!**.md"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/python.yml"
      - ".cargo/config.toml"
      - "sdk/python/**"
      - "examples/python/moq-meeting-transcriber/**"
      - "examples/python/moq-bot-job/**"
      - "examples/python/system-one-server/**"
      - "examples/python/haas-asr-server/**"
      - "crates/moqt/**"
      - "crates/broadcast/**"
      - "crates/mediapack/**"
      - "crates/msf/**"
      - "crates/telemetry-report/**"
      - "crates/telemetry/**"
      - "services/relay/**"
      - "services/vts/**"
      - "docker-compose.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain"
      - "!**.md"

concurrency:
  # Without the run_id fallback, master pushes would share one group and
  # each new push would cancel the previous master run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        dependencies: [latest, lowest]
    runs-on: ubuntu-latest
    env:
      # The dev profile reuses the dependencies the relay and VTS build compiled; release wheels pass --release.
      MATURIN_PEP517_ARGS: --profile dev
    steps:
      - name: Checkout repository
        # actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 = v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        # dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 = v1
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.100.0

      - name: Cache Rust build artifacts
        # Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 = v2.9.1
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          # The relay, VTS and moqt are workspace crates; caching them lets a PR that leaves them alone skip their build.
          cache-workspace-crates: true
          # Both jobs build the same crates, so one saves the cache they share.
          save-if: ${{ github.ref == 'refs/heads/master' && matrix.dependencies == 'latest' }}

      - name: Setup uv
        # astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 = v10.2.0
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: 0.13.4
          checksum: 2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f
          save-cache: ${{ github.ref == 'refs/heads/master' && matrix.dependencies == 'latest' }}

      # The tests start a relay and a VTS built from this workspace. Building them here keeps
      # their build time out of the test step; the tests' own cargo build then finds them fresh.
      - name: Build the relay, VTS and auth-token
        run: |
          cargo build -p relay -p vts
          cargo build -p auth-token --features cli

      - name: Type-check the Python package
        if: matrix.dependencies == 'latest'
        working-directory: sdk/python
        run: uv run pyright

      - name: Run binding tests
        if: matrix.dependencies == 'latest'
        working-directory: sdk/python
        # A fixed basetemp so the relay, VTS and Redis logs can be uploaded.
        run: uv run pytest --basetemp="$RUNNER_TEMP/pytest"

      # The extras' lower bounds are what a user may install, so the SDK is also checked on them.
      - name: Type-check and run binding tests on the lowest supported dependencies
        if: matrix.dependencies == 'lowest'
        working-directory: sdk/python
        run: |
          uv venv -p 3.11 "$RUNNER_TEMP/lowest"
          uv pip install -p "$RUNNER_TEMP/lowest" --resolution lowest-direct ".[pipecat]" "pytest>=8" "pytest-asyncio>=0.24"
          uv run -p 3.11 pyright --pythonpath "$RUNNER_TEMP/lowest/bin/python"
          "$RUNNER_TEMP/lowest/bin/python" -m pytest -p no:cacheprovider --basetemp="$RUNNER_TEMP/pytest-lowest"

      - name: Upload binding test logs
        if: failure()
        # actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a = v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-binding-logs-${{ matrix.dependencies }}
          path: ${{ runner.temp }}/pytest*/**/*.log
          if-no-files-found: ignore

      # The examples run on Python 3.11, the interpreter the lowest job already built the extension module for.
      - name: Run transcriber unit tests
        if: matrix.dependencies == 'lowest'
        working-directory: examples/python/moq-meeting-transcriber
        run: uv run -p 3.11 pytest

      - name: Run System One server unit tests
        if: matrix.dependencies == 'lowest'
        working-directory: examples/python/system-one-server
        run: uv run -p 3.11 pytest

      - name: Run Haas ASR server unit tests
        if: matrix.dependencies == 'lowest'
        working-directory: examples/python/haas-asr-server
        run: uv run -p 3.11 pytest
