name: Lint

on:
  pull_request:
  push:
    branches:
      - master
      - draft-*

concurrency:
  # Without the run_id fallback, master pushes would share one group and
  # each new push would cancel the previous master run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    container:
      image: rust:1.99.1@sha256:931c2c0531a8b143e044f0f3914dfe802f15bb3d1955f0b657e9359327ac2ffc
    env:
      RUSTFLAGS: "--cfg=tokio_unstable --cfg=web_sys_unstable_apis"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Cache Rust build artifacts
        # Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 = v2.9.1
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Install Clippy and Rustfmt
        run: |
          rustup component add clippy
          rustup component add rustfmt
      - name: Install FFmpeg build dependencies
        uses: ./.github/actions/install-ffmpeg-deps
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Check code formatting
        run: cargo fmt --all -- --check
      - name: Run Unit Tests
        run: cargo test
  moqt-version-boundary:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Warn when moqt version/ changes together with transport or runtime/tasks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          modules=crates/moqt/src/modules
          version_files="$(git diff --name-only "$BASE_SHA...HEAD" -- \
            "$modules/moqt/version.rs" "$modules/moqt/version/")"
          shared_files="$(git diff --name-only "$BASE_SHA...HEAD" -- \
            "$modules/transport.rs" "$modules/transport/" \
            "$modules/moqt/runtime/tasks.rs" "$modules/moqt/runtime/tasks/")"
          if [[ -n "$version_files" && -n "$shared_files" ]]; then
            message="Move draft-specific logic from transport and runtime/tasks into version/<draft> or the wire layer: docs/architecture/moqt/architecture.md#version-adapter-modulesmoqtversion"
            message+="%0AChanges that only route a call through the adapter are fine."
            message+="%0A%0AVersion adapter:%0A${version_files//$'\n'/%0A}"
            message+="%0A%0AVersion-independent:%0A${shared_files//$'\n'/%0A}"
            echo "::warning title=moqt version boundary::$message"
          fi
  cargo-audit:
    runs-on: ubuntu-latest
    container:
      image: rust:1.99.1@sha256:931c2c0531a8b143e044f0f3914dfe802f15bb3d1955f0b657e9359327ac2ffc
    env:
      CARGO_AUDIT_VERSION: 0.22.2
      CARGO_HOME: /usr/local/cargo
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Cache cargo-audit binary
        id: cache-cargo-audit
        # actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 = v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: /usr/local/cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-rust-1.99.1-${{ env.CARGO_AUDIT_VERSION }}
      - name: Install cargo-audit
        if: steps.cache-cargo-audit.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-audit --version "$CARGO_AUDIT_VERSION"
      - name: Verify cargo-audit version
        run: |
          actual="$(cargo-audit --version)"
          expected="cargo-audit ${CARGO_AUDIT_VERSION}"
          case "$actual" in
            "$expected"*) ;;
            *)
              echo "Unexpected cargo-audit version: $actual" >&2
              exit 1
              ;;
          esac
      - name: Run cargo audit
        run: cargo audit
  test-coverage-report:
    name: coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    container:
      image: rust:1.99.1@sha256:931c2c0531a8b143e044f0f3914dfe802f15bb3d1955f0b657e9359327ac2ffc
    env:
      RUSTFLAGS: "--cfg=tokio_unstable --cfg=web_sys_unstable_apis"
      CARGO_LLVM_COV_VERSION: 0.9.1
      CARGO_HOME: /usr/local/cargo
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Cache Rust build artifacts
        # Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 = v2.9.1
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Cache cargo-llvm-cov binary
        id: cache-cargo-llvm-cov
        # actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 = v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: /usr/local/cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-${{ runner.os }}-rust-1.99.1-${{ env.CARGO_LLVM_COV_VERSION }}
      - name: Install cargo-llvm-cov
        if: steps.cache-cargo-llvm-cov.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-llvm-cov --version "$CARGO_LLVM_COV_VERSION"
      - name: Verify cargo-llvm-cov version
        run: |
          actual="$(cargo llvm-cov --version)"
          expected="cargo-llvm-cov ${CARGO_LLVM_COV_VERSION}"
          case "$actual" in
            "$expected"*) ;;
            *)
              echo "Unexpected cargo-llvm-cov version: $actual" >&2
              exit 1
              ;;
          esac
      - name: Install llvm-tools
        run: rustup component add llvm-tools-preview
      - name: Install FFmpeg build dependencies
        uses: ./.github/actions/install-ffmpeg-deps
      - name: Generate code coverage
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      - name: Upload to codecov.io
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          token: ${{secrets.CODECOV_TOKEN}}
          files: lcov.info
          fail_ci_if_error: true
  prettier:
    runs-on: ubuntu-latest
    container:
      image: cimg/node:22.23.4@sha256:097391155ab978930031757a857cf57278b907da8a994f278bbd27443c5018bf
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Install dependencies
        run: npm ci
        working-directory: examples/browser
      - name: Check code formatting
        run: npx --prefix examples/browser prettier --check "examples/browser/**/*.{js,jsx,ts,tsx,json,css,md}" --ignore-path examples/browser/.prettierignore
  browser-unit-test:
    runs-on: ubuntu-latest
    container:
      image: cimg/node:22.23.4@sha256:097391155ab978930031757a857cf57278b907da8a994f278bbd27443c5018bf
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Install dependencies
        run: npm ci
        working-directory: examples/browser
      - name: Run browser unit tests
        run: npm test
        working-directory: examples/browser
  console-web:
    runs-on: ubuntu-latest
    container:
      image: cimg/node:22.23.4@sha256:097391155ab978930031757a857cf57278b907da8a994f278bbd27443c5018bf
    defaults:
      run:
        working-directory: crates/console/web
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Install dependencies
        run: npm ci
      - name: Check code formatting
        run: npm run format:check
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
