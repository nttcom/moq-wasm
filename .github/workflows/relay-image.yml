name: Relay Image

# Reusable workflow: build the relay docker image and push it to GHCR under the
# content-hash reference the caller resolved, so later runs with the same relay
# inputs pull it instead of compiling the relay.

on:
  workflow_call:
    inputs:
      image:
        description: "Fully-qualified relay image reference to push"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-relay-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        # actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 = v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Log in to GHCR
        # docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 = v4.4.0
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        # docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c = v4.2.0
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Build and push relay image
        # docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a = v7.3.0
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: relay/Dockerfile
          push: true
          tags: ${{ inputs.image }}
          cache-from: type=gha,scope=relay
          cache-to: type=gha,scope=relay,mode=max

      - name: Log out from GHCR
        if: always()
        run: docker logout ghcr.io
