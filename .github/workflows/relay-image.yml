name: Relay Image

# Reusable workflow: compile the relay on the runner with the cargo cache and
# wrap the binary in the relay image. Pushed to GHCR under the caller's
# content-hash reference, or uploaded as the relay-image-local artifact.

on:
  workflow_call:
    inputs:
      image:
        description: "Relay image reference to tag the build with"
        required: true
        type: string
      push:
        description: "Push the image to GHCR; otherwise upload it as the relay-image-local artifact"
        required: true
        type: boolean

env:
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"
  CARGO_INCREMENTAL: "0"

jobs:
  build-relay-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        # actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 = v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        # dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 = v1
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.96.0

      - name: Cache Rust build artifacts
        # Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 = v2.9.1
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Build relay
        run: cargo build -p relay

      - name: Stage the image build context
        run: |
          mkdir -p "${RUNNER_TEMP}/relay-image-context/keys"
          cp target/debug/relay "${RUNNER_TEMP}/relay-image-context/relay"

      - name: Log in to GHCR
        if: ${{ inputs.push }}
        # docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 = v4.4.0
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        # docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c = v4.2.0
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Build relay image
        # docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a = v7.3.0
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: ${{ runner.temp }}/relay-image-context
          file: crates/relay/Dockerfile
          build-args: RELAY_BINARY=prebuilt
          push: ${{ inputs.push }}
          load: ${{ !inputs.push }}
          tags: ${{ inputs.image }}

      - name: Save relay image
        if: ${{ !inputs.push }}
        run: docker save "${{ inputs.image }}" | gzip > "${RUNNER_TEMP}/relay-image.tar.gz"

      - name: Upload relay image artifact
        if: ${{ !inputs.push }}
        # actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a = v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: relay-image-local
          path: ${{ runner.temp }}/relay-image.tar.gz
          retention-days: 1

      - name: Log out from GHCR
        if: ${{ always() && inputs.push }}
        run: docker logout ghcr.io
