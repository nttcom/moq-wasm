name: Install apt packages
description: Install apt packages on Debian/Ubuntu from the package lists and .deb files in the Actions cache, contacting the mirror only when the cache cannot satisfy them

inputs:
  packages:
    description: Whitespace-separated apt packages to install
    required: true

runs:
  using: composite
  steps:
    - name: Resolve apt package cache
      id: apt
      shell: bash
      env:
        APT_PACKAGES: ${{ inputs.packages }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC2206
        packages=(${APT_PACKAGES})
        cache="${HOME}/.cache/apt"
        mkdir -p "${cache}/archives/partial" "${cache}/lists/partial"
        . /etc/os-release
        packages_hash="$(printf '%s\n' "${packages[@]}" | sha256sum | cut -c1-16)"
        key_prefix="apt-${ID}-${VERSION_ID}-$(uname -m)-${packages_hash}-"
        {
          echo "packages=${packages[*]}"
          echo "cache=${cache}"
          echo "key-prefix=${key_prefix}"
          echo "month-key-prefix=${key_prefix}$(date -u +%Y-%m)-"
        } >> "$GITHUB_OUTPUT"

    - name: Restore apt package cache
      id: restore
      # actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 = v6.1.0
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          ${{ steps.apt.outputs.cache }}/archives/*.deb
          ${{ steps.apt.outputs.cache }}/lists/*_*
        key: ${{ steps.apt.outputs.month-key-prefix }}${{ github.run_id }}
        # An earlier month's cache still installs without the mirror.
        restore-keys: ${{ steps.apt.outputs.key-prefix }}

    - name: Install apt packages
      id: install
      shell: bash
      env:
        APT_CACHE: ${{ steps.apt.outputs.cache }}
        APT_PACKAGES: ${{ steps.apt.outputs.packages }}
        # Once a month master downloads again, so the cached packages follow
        # distribution updates. Other refs cannot save a cache master reads.
        APT_REFRESH: ${{ github.ref == 'refs/heads/master' && !startsWith(steps.restore.outputs.cache-matched-key, steps.apt.outputs.month-key-prefix) }}
      run: |
        set -euo pipefail
        # Container jobs run as root; jobs on the runner host need sudo.
        privileged=""
        if [ "$(id -u)" -ne 0 ]; then
          privileged="sudo"
        fi
        # APT::Sandbox::User=root: the _apt download sandbox user cannot write to
        # the runner-owned cache directories.
        apt_options=(
          -o Dir::State::Lists="${APT_CACHE}/lists"
          -o Dir::Cache::Archives="${APT_CACHE}/archives"
          -o APT::Sandbox::User=root
        )
        install() {
          # shellcheck disable=SC2086
          $privileged env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            "${apt_options[@]}" "$@" ${APT_PACKAGES}
        }
        # Mirror downloads on the runner sometimes stall for minutes, so install
        # from the cached lists and .deb files first.
        if [ "${APT_REFRESH}" != "true" ] && install --no-download; then
          echo "downloaded=false" >> "$GITHUB_OUTPUT"
        else
          $privileged apt-get update "${apt_options[@]}"
          install
          # Drops the .deb files of versions the mirror no longer offers.
          $privileged apt-get autoclean "${apt_options[@]}"
          echo "downloaded=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Save apt package cache
      if: ${{ steps.install.outputs.downloaded == 'true' }}
      # actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 = v6.1.0
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          ${{ steps.apt.outputs.cache }}/archives/*.deb
          ${{ steps.apt.outputs.cache }}/lists/*_*
        key: ${{ steps.apt.outputs.month-key-prefix }}${{ github.run_id }}
