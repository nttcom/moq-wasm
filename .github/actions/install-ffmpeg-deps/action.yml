name: Install media build dependencies
description: Install FFmpeg and GStreamer build and runtime dependencies on Debian/Ubuntu

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          ffmpeg \
          pkg-config \
          libavutil-dev \
          libavfilter-dev \
          libavcodec-dev \
          libavformat-dev \
          libavdevice-dev \
          libswscale-dev \
          libswresample-dev \
          libgstreamer1.0-dev \
          libgstreamer-plugins-base1.0-dev \
          gstreamer1.0-plugins-good \
          gstreamer1.0-plugins-bad \
          gstreamer1.0-plugins-ugly \
          gstreamer1.0-libav \
          clang \
          libclang-dev \
          llvm-dev
        echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
        echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV"
