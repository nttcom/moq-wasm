name: Install media build dependencies
description: Install the FFmpeg CLI and the GStreamer build and runtime dependencies on Debian/Ubuntu

runs:
  using: composite
  steps:
    - name: Install apt packages
      uses: ./.github/actions/install-apt-packages
      with:
        packages: >-
          ffmpeg
          pkg-config
          libgstreamer1.0-dev
          libgstreamer-plugins-base1.0-dev
          gstreamer1.0-tools
          gstreamer1.0-plugins-base
          gstreamer1.0-plugins-good
          gstreamer1.0-plugins-bad
          gstreamer1.0-plugins-ugly
          gstreamer1.0-libav

    - name: Expose system pkg-config files
      shell: bash
      run: echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
