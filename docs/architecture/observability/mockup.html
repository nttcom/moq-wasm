<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>MoQ Observability mockup</title>
<style>
  :root { color-scheme: dark; --bg:#141414; --panel:#1c1c1c; --line:#2e2e2e; --text:#e8e8e6; --muted:#9a9a96; --ok:#5DCAA5; --warn:#EF9F27; --bad:#E24B4A; }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--text); font: 13px/1.4 -apple-system, "Helvetica Neue", sans-serif; }
  header { display:flex; align-items:center; gap:16px; padding:12px 20px; border-bottom:1px solid var(--line); }
  header h1 { font-size:15px; font-weight:500; margin:0; }
  .timeline { display:flex; align-items:center; gap:8px; color:var(--muted); }
  .timeline input { width:180px; accent-color:#85B7EB; }
  .live { display:flex; align-items:center; gap:6px; color:var(--ok); background:none; border:none; font:inherit; cursor:pointer; padding:0; min-width:118px; }
  .live.past { color:var(--warn); }
  .live.past i { background:var(--warn); animation:none; }
  .live i { width:8px; height:8px; border-radius:50%; background:var(--ok); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity:.3 } }
  .filter { color:var(--muted); display:flex; align-items:center; gap:6px; }
  .filter input { width:150px; background:#2a2a2a; color:var(--text); border:1px solid #3a3a3a; border-radius:6px; padding:3px 8px; font:inherit; }
  .filter input.active { border-color:#85B7EB; }
  .filter button { background:none; border:none; color:var(--muted); font-size:15px; cursor:pointer; padding:0 2px; }
  .filter select { background:#2a2a2a; color:var(--text); border:1px solid #3a3a3a; border-radius:6px; padding:3px 8px; font:inherit; }
  .stats { margin-left:auto; display:flex; gap:20px; color:var(--muted); }
  .stats b { color:var(--text); font-weight:500; }
  main { display:flex; flex:1; min-height:0; position:relative; }
  #graph { flex:1; min-width:0; height:100%; background-image: radial-gradient(#262626 1px, transparent 1px); background-size: 18px 18px; }
  .zoom { position:absolute; top:12px; right:16px; display:flex; flex-direction:column; border:1px solid #3a3a3a; border-radius:6px; overflow:hidden; background:#1c1c1c; }
  .zoom button { width:30px; height:28px; background:none; border:none; color:var(--text); font-size:15px; cursor:pointer; }
  .zoom button + button { border-top:1px solid #3a3a3a; }
  .zoom button:hover { background:#2a2a2a; }
  .drawer-body { display:flex; flex:1; min-height:0; }
  .details { width:300px; flex:none; overflow-y:auto; padding:10px 16px; border-right:1px solid var(--line); }
  .details .sub { color:var(--muted); margin-bottom:6px; }
  .details .section:first-of-type { margin-top:8px; }
  .section { margin-top:14px; padding:8px 0 4px; border-top:1px solid var(--line); font-weight:500; display:flex; justify-content:space-between; }
  .section small { color:#85B7EB; font-weight:400; }
  .note { color:var(--muted); font-size:11px; margin-bottom:4px; }
  .m { display:grid; grid-template-columns: 1fr auto; align-items:center; gap:8px; padding:3px 0; }
  .m .name { color:var(--muted); }
  .m .val { text-align:right; font-weight:500; }
  .rows div { display:flex; justify-content:space-between; padding:3px 0; color:var(--muted); }
  .rows span:first-child { color:var(--text); }
  main { --drawer-h:45vh; }
  .drawer { position:absolute; left:0; right:0; bottom:0; height:var(--drawer-h); background:rgba(20,20,20,.97); border-top:1px solid #3a3a3a; display:none; flex-direction:column; }
  main.drawer-open .drawer { display:flex; }
  main.drawer-open .legend { bottom:calc(var(--drawer-h) + 12px); }
  .drawer-grip { height:8px; cursor:ns-resize; display:flex; justify-content:center; align-items:center; flex:none; }
  .drawer-grip::before { content:""; width:40px; height:3px; border-radius:2px; background:#4a4a4a; }
  .drawer-grip:hover::before, main.resizing .drawer-grip::before { background:#85B7EB; }
  main.resizing { cursor:ns-resize; user-select:none; }
  .drawer-head { display:flex; align-items:center; gap:12px; padding:8px 16px; border-bottom:1px solid var(--line); }
  .drawer-head small { color:var(--muted); }
  #ranges { margin-left:auto; display:flex; gap:2px; }
  #ranges button, #drawer-close { background:none; border:1px solid transparent; color:var(--muted); border-radius:6px; padding:2px 8px; font:inherit; cursor:pointer; }
  #ranges button.on { border-color:#3a3a3a; background:#2a2a2a; color:var(--text); }
  #drawer-close { font-size:16px; }
  .charts { flex:1; align-content:start; display:grid; grid-template-columns:repeat(auto-fill, minmax(340px, 1fr)); gap:10px; padding:10px 16px 14px; overflow-y:auto; scrollbar-gutter:stable; }
  .chart { background:#1c1c1c; border:1px solid var(--line); border-radius:8px; padding:8px 10px 6px; }
  .chart-head { display:flex; justify-content:space-between; font-weight:500; margin-bottom:2px; }
  .chart-head small { color:var(--muted); font-weight:400; }
  .plot { width:100%; height:auto; display:block; }
  .plot .axis { fill:var(--muted); font-size:9px; }
  .plot .cross { stroke:#9a9a96; stroke-dasharray:2 2; }
  .plot .hover { fill:transparent; cursor:crosshair; }
  .chart-legend { display:flex; flex-wrap:wrap; gap:4px 12px; font-size:11px; color:var(--muted); }
  .chart-legend i { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:5px; }
  .chart-legend b { color:var(--text); font-weight:500; margin-left:6px; }
  .legend { position:absolute; left:16px; bottom:12px; display:flex; flex-direction:column; gap:4px; font-size:11px; color:var(--muted); pointer-events:none; }
  .legend span::before { content:""; display:inline-block; width:18px; height:0; border-top:2px dashed currentColor; margin-right:6px; vertical-align:middle; }
  #graph { cursor:grab; touch-action:none; }
  #graph.panning { cursor:grabbing; }
  .node { cursor:pointer; }
  .node .box { fill:#252525; stroke:#4a4a4a; }
  .node.sel .box { stroke:#85B7EB; stroke-width:2; }
  .relay .box { fill:#2b2b2b; stroke:#555; }
  .relay .unit { fill:#1e1e1e; stroke:#4a4a4a; }
  .relay .vent { stroke:#444; stroke-width:1; }
  .relay .led { animation: blink 1.6s infinite; }
  @keyframes blink { 50% { opacity:.35 } }
  .flow { fill:none; stroke-width:1.6; stroke-dasharray:5 5; animation: flow linear infinite; transition: opacity .2s; pointer-events:none; }
  .flow.sel { stroke-width:3; }
  .flow.focus { stroke:#85B7EB; stroke-width:2.4; marker-end:url(#arrow-focus); }
  .flow.focus.sel { stroke-width:3.2; }
  .hit { fill:none; stroke:transparent; stroke-width:14; cursor:pointer; }
  .dim { opacity:.1; }
  .node { transition: opacity .2s; }
  .node.dim { opacity:.3; }
  .hidden { display:none; }
  @keyframes flow { to { stroke-dashoffset:-20; } }
  text { fill:var(--text); font-size:11px; }
  text.muted { fill:var(--muted); font-size:10px; }
  .pill { fill:#3a3a3a; }
</style>
</head>
<body>
<header>
  <h1>MoQ Observability</h1>
  <label class="filter">App <select id="app-filter"></select></label>
  <label class="filter">Track Namespace <input id="ns-filter" list="ns-options" placeholder="prefix, e.g. room1" autocomplete="off" /><datalist id="ns-options"></datalist><button id="ns-clear" aria-label="Clear namespace filter">×</button></label>
  <div class="timeline" title="Seek back up to 7 days">
    <span>7d ago</span>
    <input id="seek" type="range" min="0" max="100" value="100" step="1" aria-label="Snapshot time" />
    <button id="live" class="live"><i></i><span id="seek-label">Live</span></button>
  </div>
  <div class="stats">
    <span>Relays <b>3</b></span>
    <span>Clients <b id="s-clients"></b></span>
    <span>Subscriptions <b id="s-subs"></b></span>
    <span>Egress <b>48.2 Mbps</b></span>
  </div>
</header>
<main>
  <svg id="graph" viewBox="0 0 1000 840" preserveAspectRatio="xMidYMid meet">
    <defs>
      <marker id="arrow-focus" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#85B7EB"/></marker>
      <marker id="arrow-up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#888780"/></marker>
      <marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5DCAA5"/></marker>
      <marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#EF9F27"/></marker>
      <marker id="arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E24B4A"/></marker>
    </defs>
    <g id="env"></g>
    <g id="flows"></g>
    <g id="hits"></g>
    <g id="nodes"></g>
  </svg>
  <div class="legend">
    <span style="color:#85B7EB">shown in charts</span>
    <span style="color:#888780">uplink</span>
    <span style="color:var(--ok)">downlink loss &lt; 1%</span>
    <span style="color:var(--warn)">downlink loss 1–5%</span>
    <span style="color:var(--bad)">downlink loss &gt; 5%</span>
  </div>
  <div class="zoom" role="group" aria-label="Zoom">
    <button id="zoom-in" aria-label="Zoom in">+</button>
    <button id="zoom-out" aria-label="Zoom out">−</button>
    <button id="zoom-fit" aria-label="Fit to view" title="Fit to view">⤢</button>
  </div>
  <section class="drawer" aria-label="Charts">
    <div class="drawer-grip" id="drawer-grip" title="Drag to resize"></div>
    <div class="drawer-head"><b id="drawer-title"></b><small id="drawer-time">latest</small><div id="ranges"></div><button id="drawer-close" aria-label="Close charts">×</button></div>
    <div class="drawer-body"><div id="details" class="details"></div><div id="charts" class="charts"></div></div>
  </section>
</main>
<script>
const center = { x: 500, y: 420 }, envR = 230, clientR = 345, relayHalf = { w: 62, h: 50 };
const LIVE = "ac8adbc8-a2ff-4c41-9f5e-fdaed5e1e65e", MEET = "9f1c2a3b-4d5e-4f60-8a7b-1c2d3e4f5a6b", CAM = "5b7e0d12-8c4f-4a39-b1e6-2f9a7c3d8e01";
const apps = { [LIVE]: "live streaming", [MEET]: "meeting", [CAM]: "camera monitoring" };
const relays = [
  { id: "relay-a", x: 415, y: 340, rss: 412, cache: 96, cacheObjects: 5120, tracks: 4 },
  { id: "relay-b", x: 595, y: 345, rss: 288, cache: 41, cacheObjects: 2210, tracks: 9 },
  { id: "relay-c", x: 505, y: 515, rss: 190, cache: 22, cacheObjects: 1180, tracks: 2 },
];
const clients = [
  { id: "camera-03", app: CAM, relay: "relay-a", angle: 172, rtt: 12, loss: 0.0 },
  { id: "viewer-a3", app: LIVE, relay: "relay-a", angle: 192, rtt: 41, loss: 2.4 },
  { id: "viewer-a2", app: LIVE, relay: "relay-a", angle: 212, rtt: 35, loss: 0.8 },
  { id: "viewer-a1", app: LIVE, relay: "relay-a", angle: 232, rtt: 22, loss: 0.1 },
  { id: "ingest-01", app: LIVE, relay: "relay-a", angle: 254, rtt: 18, loss: 0.2 },
  { id: "alice", app: MEET, relay: "relay-b", angle: 286, rtt: 24, loss: 0.3 },
  { id: "bob", app: MEET, relay: "relay-b", angle: 306, rtt: 31, loss: 0.6 },
  { id: "carol", app: MEET, relay: "relay-b", angle: 326, rtt: 58, loss: 3.1, upTrouble: true },
  { id: "dave", app: MEET, relay: "relay-b", angle: 346, rtt: 27, loss: 0.4 },
  { id: "viewer-b1", app: LIVE, relay: "relay-b", angle: 8, rtt: 48, loss: 6.2 },
  { id: "viewer-c1", app: LIVE, relay: "relay-c", angle: 62, rtt: 29, loss: 0.5 },
  { id: "viewer-c2", app: LIVE, relay: "relay-c", angle: 86, rtt: 33, loss: 0.9 },
  { id: "viewer-c3", app: LIVE, relay: "relay-c", angle: 110, rtt: 52, loss: 1.8 },
  { id: "monitor", app: CAM, relay: "relay-c", angle: 134, rtt: 21, loss: 0.2 },
];
const tracks = [
  { publisher: "ingest-01", namespace: "live/ch1", names: ["video", "audio"] },
  { publisher: "camera-03", namespace: "site1/cam3", names: ["video"] },
  { publisher: "alice", namespace: "room1/alice", names: ["video", "audio"] },
  { publisher: "bob", namespace: "room1/bob", names: ["video", "audio"] },
  { publisher: "carol", namespace: "room1/carol", names: ["video", "audio"] },
  { publisher: "dave", namespace: "room1/dave", names: ["video", "audio"] },
];
const subscriptions = [
  ["ingest-01", "viewer-a1", 4.1], ["ingest-01", "viewer-a2", 4.1], ["ingest-01", "viewer-a3", 2.0],
  ["ingest-01", "viewer-b1", 1.2], ["ingest-01", "viewer-c1", 4.1], ["ingest-01", "viewer-c2", 4.1], ["ingest-01", "viewer-c3", 2.2],
  ["camera-03", "monitor", 2.5],
  ["alice", "bob", 1.5], ["alice", "carol", 1.0], ["alice", "dave", 1.5],
  ["bob", "alice", 1.5], ["bob", "carol", 1.0], ["bob", "dave", 1.5],
  ["carol", "alice", 1.4], ["carol", "bob", 1.4], ["carol", "dave", 1.1],
  ["dave", "alice", 1.5], ["dave", "bob", 1.5], ["dave", "carol", 1.4],
];

const ns = "http://www.w3.org/2000/svg";
const el = (tag, attrs, parent) => { const e = document.createElementNS(ns, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent && parent.appendChild(e); return e; };
const txt = (parent, x, y, s, cls, anchor = "middle") => { const t = el("text", { x, y, "text-anchor": anchor }, parent); if (cls) t.setAttribute("class", cls); t.textContent = s; return t; };
const health = loss => loss < 1 ? "ok" : loss <= 5 ? "warn" : "bad";
const color = { ok: "#5DCAA5", warn: "#EF9F27", bad: "#E24B4A", up: "#888780" };
const relayById = Object.fromEntries(relays.map(r => [r.id, r]));
const clientById = Object.fromEntries(clients.map(c => [c.id, c]));
const trackOf = id => tracks.find(t => t.publisher === id);
const lagOf = sub => clientById[sub[1]].loss > 5 ? 2 : clientById[sub[1]].loss > 2 ? 1 : 0;
for (const c of clients) {
  const t = c.angle * Math.PI / 180;
  c.x = center.x + clientR * Math.cos(t);
  c.y = center.y + clientR * Math.sin(t);
  const own = trackOf(c.id);
  c.published = own ? [own.namespace] : [];
  c.subscribed = [...new Set(subscriptions.filter(s => s[1] === c.id).map(s => trackOf(s[0]).namespace))];
  c.trackCount = own ? own.names.length : 0;
}

const filter = document.getElementById("app-filter");
const nsFilter = document.getElementById("ns-filter");
let manualApp = "";
const elements = ns => ns.split("/").filter(Boolean);
const nsMatches = ns => { const prefix = elements(nsFilter.value); return elements(ns).slice(0, prefix.length).join("/") === prefix.join("/"); };
const commonPrefix = list => list.reduce((acc, ns) => { const e = elements(ns); let i = 0; while (i < acc.length && acc[i] === e[i]) i++; return acc.slice(0, i); }, elements(list[0] || ""));
filter.innerHTML = `<option value="">All apps</option>` + Object.keys(apps).map(id => `<option value="${id}">${id.slice(0, 8)}… ${apps[id]}</option>`).join("");

const env = document.getElementById("env");
el("circle", { cx: center.x, cy: center.y, r: envR, fill: "#1f1f1f", stroke: "#333" }, env);
el("rect", { x: center.x - 80, y: center.y - envR - 10, width: 160, height: 20, rx: 10, class: "pill" }, env);
txt(env, center.x, center.y - envR + 4, "GCP · asia-northeast1");
txt(env, 120, 70, "Internet", "muted", "start");

const links = new Map();
function addLink(from, to, mbps, sub) {
  const key = `${from}>${to}`;
  if (!links.has(key)) links.set(key, { key, from, to, mbps: 0, subs: new Set() });
  const link = links.get(key);
  link.subs.add(sub);
  link.byPublisher = { ...link.byPublisher, [subscriptions[sub][0]]: Math.max(link.byPublisher?.[subscriptions[sub][0]] || 0, mbps) };
  link.mbps = Object.values(link.byPublisher).reduce((a, b) => a + b, 0);
}
subscriptions.forEach(([pub, sub, mbps], i) => {
  const pr = clientById[pub].relay, sr = clientById[sub].relay;
  addLink(pub, pr, mbps, i);
  if (pr !== sr) addLink(pr, sr, mbps, i);
  addLink(sr, sub, mbps, i);
});
const hopsOf = i => {
  const [pub, sub] = subscriptions[i], pr = clientById[pub].relay, sr = clientById[sub].relay;
  return pr === sr ? [`${pub}>${pr}`, `${sr}>${sub}`] : [`${pub}>${pr}`, `${pr}>${sr}`, `${sr}>${sub}`];
};
const carriedSubs = (link, subs) => [...link.subs].filter(i => subs.has(i));
const kindOf = link => clientById[link.from] ? "uplink" : clientById[link.to] ? "downlink" : "inter-relay";

const pos = id => clientById[id] || relayById[id];
const flows = document.getElementById("flows"), hits = document.getElementById("hits");
for (const link of links.values()) {
  const a = pos(link.from), b = pos(link.to);
  const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy);
  const nx = -dy / len * 4, ny = dx / len * 4;
  const half = id => relayById[id] ? relayHalf : { w: 50, h: 22 };
  const edge = id => Math.min(half(id).w / Math.abs(dx / len || 1e-9), half(id).h / Math.abs(dy / len || 1e-9));
  const startPad = edge(link.from) + 2, endPad = edge(link.to) + 6;
  const d = `M${a.x + dx / len * startPad + nx},${a.y + dy / len * startPad + ny} L${b.x - dx / len * endPad + nx},${b.y - dy / len * endPad + ny}`;
  const kind = kindOf(link);
  const h = kind === "uplink" ? "up" : kind === "downlink" ? health(clientById[link.to].loss) : "ok";
  link.path = el("path", { d, class: "flow", stroke: color[h], "marker-end": `url(#arrow-${h})` }, flows);
  link.path.style.animationDuration = `${(3 / link.mbps).toFixed(2)}s`;
  link.hit = el("path", { d, class: "hit" }, hits);
  link.hit.addEventListener("click", () => focusOn(link.key));
}

const nodes = document.getElementById("nodes");
const nodeEls = {};
for (const r of relays) {
  const g = el("g", { class: "node relay" }, nodes);
  const { w, h } = relayHalf;
  el("rect", { class: "box", x: r.x - w, y: r.y - h, width: w * 2, height: h * 2, rx: 6 }, g);
  ["#5DCAA5", "#85B7EB"].forEach((ledColor, i) => {
    const uy = r.y - h + 8 + i * 17;
    el("rect", { class: "unit", x: r.x - w + 8, y: uy, width: w * 2 - 16, height: 13, rx: 2 }, g);
    for (let v = 0; v < 6; v++) el("line", { class: "vent", x1: r.x - w + 16 + v * 6, y1: uy + 3, x2: r.x - w + 16 + v * 6, y2: uy + 10 }, g);
    el("circle", { class: "led", cx: r.x + w - 24, cy: uy + 6.5, r: 2.2, fill: ledColor, style: `animation-delay:${i * 0.5}s` }, g);
    el("circle", { cx: r.x + w - 16, cy: uy + 6.5, r: 2.2, fill: "#555" }, g);
  });
  txt(g, r.x, r.y + 8, r.id);
  txt(g, r.x, r.y + 24, `RSS ${r.rss} MB`, "muted");
  txt(g, r.x, r.y + 38, `cache ${r.cache} MB`, "muted");
  g.addEventListener("click", () => focusOn(r.id));
  nodeEls[r.id] = g;
}
const label = list => list.length > 1 ? `${list[0]} +${list.length - 1}` : list[0] || "";
for (const c of clients) {
  const g = el("g", { class: "node", transform: `translate(${c.x - 50},${c.y - 22})` }, nodes);
  el("rect", { class: "box", width: 100, height: 44, rx: 6 }, g);
  txt(g, 10, 18, c.id, null, "start");
  txt(g, 10, 33, label(c.published.length ? c.published : c.subscribed), "muted", "start");
  if (c.trackCount) {
    el("circle", { cx: 86, cy: 16, r: 8, fill: "#e8e8e6" }, g);
    txt(g, 86, 20, c.trackCount, null).setAttribute("style", "fill:#141414;font-weight:500");
  }
  g.addEventListener("click", () => focusOn(c.id));
  nodeEls[c.id] = g;
}

const section = (title, direction) => `<div class="section"><span>${title}</span><small>${direction}</small></div>`;

function upStats(c) {
  const own = trackOf(c.id);
  if (!own) return null;
  const visible = visibleSubs();
  const out = subscriptions.filter((s, i) => s[0] === c.id && visible.has(i));
  if (!out.length) return null;
  const t = !!c.upTrouble;
  return { own, out, mbps: Math.max(...out.map(e => e[2])), gapMs: t ? 180 : 34, blocked: t ? 3 : 0, resets: t ? 2 : 0 };
}
function downStats(c) {
  const visible = visibleSubs();
  const inn = subscriptions.filter((s, i) => s[1] === c.id && visible.has(i));
  if (!inn.length) return null;
  const mbps = inn.reduce((s, e) => s + e[2], 0), h = health(c.loss), severe = c.loss > 5;

}

  showIndex(Math.max(0, Math.min(POINTS - 1, Math.round((point.x - ML) / (W - ML - MR) * (POINTS - 1)))));
});
document.getElementById("charts").addEventListener("mouseleave", () => showIndex(null));
function openDrawer(id) {
  drawerSelection = id;
  const link = links.get(id);
  document.getElementById("drawer-title").textContent = link ? `${link.from} → ${link.to}` : id;
  document.querySelector("main").classList.add("drawer-open");
  document.getElementById("details").innerHTML = details(id);
  renderCharts();
}
function closeDrawer() {
  drawerSelection = null;
  document.querySelector("main").classList.remove("drawer-open");
}
document.getElementById("drawer-close").addEventListener("click", closeDrawer);
document.getElementById("drawer-grip").addEventListener("pointerdown", event => {
  const main = document.querySelector("main"), grip = event.currentTarget;
  const bottom = main.getBoundingClientRect().bottom, maxHeight = main.clientHeight - 60;
  grip.setPointerCapture(event.pointerId);
  main.classList.add("resizing");
  const move = e => main.style.setProperty("--drawer-h", `${Math.round(Math.max(160, Math.min(maxHeight, bottom - e.clientY)))}px`);
  const up = () => { main.classList.remove("resizing"); grip.removeEventListener("pointermove", move); grip.removeEventListener("pointerup", up); };
  grip.addEventListener("pointermove", move);
  grip.addEventListener("pointerup", up);
});
document.getElementById("ranges").innerHTML = Object.keys(ranges).map(r => `<button data-range="${r}" class="${r === range ? "on" : ""}">${r}</button>`).join("");
document.getElementById("ranges").addEventListener("click", event => {
  const button = event.target.closest("button");
  if (!button) return;
  range = button.dataset.range;
  document.querySelectorAll("#ranges button").forEach(b => b.classList.toggle("on", b === button));
  renderCharts();
});
seek.addEventListener("input", renderCharts);
filter.addEventListener("change", () => { manualApp = filter.value; applyFilter(); });
nsFilter.addEventListener("input", applyFilter);
document.getElementById("ns-clear").addEventListener("click", () => { nsFilter.value = ""; applyFilter(); });
applyFilter();
</script>
</body>
</html>
